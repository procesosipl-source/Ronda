<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ronda — demo de gestión para centros de salud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --sunk:#F0F1F4; --line:#E5E7EB; --ink:#1F2328; --ink-2:#4B5563; --ink-3:#6B7280;
  --primary:#B8520A; --primary-ink:#FFFFFF; --primary-soft:#FFF1E6; --brand:#F07D00;
  --warn:#8A6100; --warn-soft:#FEF6D8; --danger:#B42318; --danger-soft:#FDECEA; --ok:#1E7A4C; --ok-soft:#E3F4EA;
  --d-psi:#2563EB; --d-psq:#7C3AED; --d-ts:#0891B2; --d-enf:#059669; --d-nut:#65A30D; --d-gru:#DB2777;
  --radius-s:8px; --radius-m:12px;
  --sans:"Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --serif:"Newsreader", Georgia, "Times New Roman", serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-0.01em}
h1{font-size:1.6rem} h2{font-size:1.15rem} h3{font-size:1rem}
p{margin:0}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);height:100%}
/* Sidebar */
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:22px 20px 14px;display:flex;align-items:flex-end;gap:8px}
.brand svg{display:block;height:30px;width:auto}
.brand b{font-size:1.45rem;font-weight:700;letter-spacing:-0.03em;display:flex;align-items:center;gap:8px}

.brand span{font-size:.8rem;color:var(--ink-3)}
.tenant{margin:0 12px 12px;padding:10px 12px;border-radius:var(--radius-m);background:var(--sunk);font-size:.85rem}
.tenant small{display:block;color:var(--ink-3);font-size:.75rem}
.nav{display:flex;flex-direction:column;padding:4px 8px;gap:2px;overflow:auto;flex:1}
.nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:var(--radius-s);color:var(--ink-2);display:flex;justify-content:space-between;align-items:center}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--primary-soft);color:var(--primary);font-weight:600;box-shadow:inset 3px 0 0 var(--brand)}
.nav button:focus-visible{outline:2px solid var(--primary)}
.nav .count{font-size:.75rem;background:var(--warn-soft);color:var(--warn);padding:1px 7px;border-radius:20px;font-weight:600}
.nav .sep{height:1px;background:var(--line);margin:8px 12px}
.side-foot{padding:12px 16px;border-top:1px solid var(--line);font-size:.8rem;color:var(--ink-3)}
.side-foot button{all:unset;cursor:pointer;color:var(--primary);text-decoration:underline}
/* Main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;padding:12px 28px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.top .who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:.88rem}
.rolepick{display:flex;background:var(--sunk);border-radius:var(--radius-m);padding:3px;gap:2px}
.rolepick button{all:unset;cursor:pointer;padding:6px 11px;border-radius:7px;font-size:.84rem;color:var(--ink-2)}
.rolepick button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.rolepick button:focus-visible{outline:2px solid var(--primary)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font-size:.78rem;font-weight:700}
.content{flex:1;overflow:auto;padding:28px}
.inner{max-width:1180px;margin:0 auto}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.head p{color:var(--ink-2);margin-top:4px}
/* Primitives */
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:var(--radius-s);font-size:.88rem;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 9px;font-size:.8rem}
.btn.ghost{border-color:transparent;background:transparent;color:var(--primary)}
.btn:disabled{opacity:.5;cursor:not-allowed}
a.btn{color:var(--ink);text-decoration:none;display:inline-block}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);box-shadow:0 1px 2px rgba(16,24,40,.04)}
.panel-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.panel-b{padding:14px 18px}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .small{font-size:.83rem}
.tag{display:inline-block;font-size:.76rem;padding:2px 8px;border-radius:20px;background:var(--sunk);color:var(--ink-2);font-weight:500;white-space:nowrap}
.tag.prox{background:var(--sunk);color:var(--ink-3);border:1px dashed var(--line)}
.btn.prox{border-style:dashed;color:var(--ink-3)}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.danger{background:var(--danger-soft);color:var(--danger)} .tag.pri{background:var(--primary-soft);color:var(--primary)}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px}
.stack{display:flex;flex-direction:column;gap:20px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;font-weight:500;color:var(--ink-3);font-size:.8rem;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
input[type=text],input[type=search],input[type=date],input[type=time],input[type=number],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-s);padding:7px 10px;width:100%}
textarea{font-family:var(--serif);font-size:1.02rem;line-height:1.55;min-height:130px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.84rem;color:var(--ink-2)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{cursor:pointer;border:1px solid var(--line);background:var(--surface);padding:4px 11px;border-radius:20px;font-size:.82rem;color:var(--ink-2)}
label.chip{display:inline-flex;align-items:center;min-height:32px}
label.chip:has(input:checked){background:var(--primary-soft);border-color:var(--primary);color:var(--primary);font-weight:600}
.chip[aria-pressed="true"]{background:var(--primary-soft);color:var(--primary);border-color:var(--primary)}
.bar{height:6px;border-radius:4px;background:var(--sunk);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--primary)}
.bar.warn i{background:var(--warn)} .bar.danger i{background:var(--danger)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.empty{padding:30px;text-align:center;color:var(--ink-2)}
/* Today */
.daystrip{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:var(--radius-m);background:var(--surface);margin-bottom:20px}
.daystrip div{padding:16px 18px;border-right:1px solid var(--line)}
.daystrip div:last-child{border-right:none}
.daystrip b{display:block;font-size:1.55rem;font-weight:600;letter-spacing:-0.02em}
.daystrip span{font-size:.84rem;color:var(--ink-2)}
.alert{display:flex;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
.alert:last-child{border-bottom:none}
.alert:hover{background:var(--sunk)}
.alert .k{width:4px;align-self:stretch;border-radius:3px;background:var(--warn);flex:none}
.alert .k.danger{background:var(--danger)}
.alert .k.info{background:var(--primary)}
.sigbox{margin-top:10px;border:1px dashed var(--line);border-radius:var(--radius-s);background:var(--sunk);padding:14px 16px;font-family:var(--serif);font-size:1.15rem;color:var(--ink)}
.sigbox small{display:block;font-family:var(--sans);font-size:.76rem;color:var(--ink-3);margin-top:2px}
.agenda-row{display:grid;grid-template-columns:60px 1fr auto;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line);align-items:center}
.agenda-row:last-child{border-bottom:none}
.agenda-row time{font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:.88rem}
.banner{display:flex;gap:14px;align-items:center;justify-content:space-between;background:var(--primary-soft);border-radius:var(--radius-m);padding:12px 16px;margin-bottom:20px;font-size:.9rem;flex-wrap:wrap}
/* Agenda grid */
.week{display:grid;grid-template-columns:56px repeat(5,minmax(120px,1fr));min-width:720px}
.week .hd{padding:10px 8px;border-bottom:1px solid var(--line);font-size:.84rem;font-weight:600;position:sticky;top:0;background:var(--surface);z-index:1}
.week .hd.today{color:var(--primary)}
.week .hr{font-size:.76rem;color:var(--ink-3);padding:4px 8px;border-right:1px solid var(--line);font-variant-numeric:tabular-nums}
.week .cell{border-bottom:1px dashed var(--line);border-right:1px solid var(--line);min-height:38px;padding:3px;cursor:pointer}
.week .cell.off{background:repeating-linear-gradient(135deg,var(--sunk) 0 6px,transparent 6px 12px);cursor:default}
.week .cell.free:hover{background:var(--primary-soft)}
.slot{font-size:.78rem;border-radius:5px;padding:4px 7px;background:var(--primary-soft);border-left:3px solid var(--primary);line-height:1.25}
.slot.presente{background:var(--ok-soft);border-left-color:var(--ok)}
.slot.ausente{background:var(--danger-soft);border-left-color:var(--danger);text-decoration:line-through;text-decoration-color:var(--ink-3)}
.slot small{display:block;color:var(--ink-2)}
/* HC timeline */
.ptop{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:18px}
.ptop h1{font-weight:600;font-size:1.8rem;letter-spacing:-0.02em}
.facts{display:flex;gap:18px;flex-wrap:wrap;color:var(--ink-2);font-size:.88rem;margin-top:6px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:10px 14px;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--primary);border-bottom-color:var(--brand);font-weight:600}
.tabs button:focus-visible{outline:2px solid var(--primary)}
.tl-day{margin:22px 0 8px;font-size:.84rem;color:var(--ink-3);font-weight:500}
.tl-day:first-child{margin-top:0}
.entry{display:grid;grid-template-columns:4px 1fr;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.entry .rail{border-radius:3px}
.entry .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.84rem;color:var(--ink-2)}
.entry .meta b{color:var(--ink);font-weight:600}
.entry .text{font-family:var(--serif);font-size:1.06rem;line-height:1.6;margin-top:6px;max-width:72ch;white-space:pre-wrap}
.entry .sig{font-size:.77rem;color:var(--ink-3);margin-top:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.addenda{margin-top:10px;padding:8px 12px;border-left:2px solid var(--line);font-family:var(--serif);font-size:.98rem}
.addenda small{display:block;font-family:var(--sans);color:var(--ink-3);font-size:.76rem}
.vitals{display:flex;gap:14px;font-size:.84rem;margin-top:6px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.locked{padding:40px 24px;text-align:center;border:1px dashed var(--line);border-radius:var(--radius-m);color:var(--ink-2)}
.locked b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:6px}
/* Beds */
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.bed{padding:12px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.bed:first-child{border-top:none}
.bed.free{color:var(--ink-3)}
/* Kanban */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.messel{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.messel select{width:auto;font-weight:600;min-width:170px}
.col{background:var(--sunk);border-radius:var(--radius-m);padding:10px;display:flex;flex-direction:column;gap:10px;min-height:120px}
.col h3{font-size:.9rem;padding:4px 6px;display:flex;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 12px;display:flex;flex-direction:column;gap:7px;font-size:.87rem}
/* Meds */
.hourblock{margin-bottom:18px}
.hourblock.now .panel{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.medrow{display:grid;grid-template-columns:1.1fr 1.4fr minmax(300px,auto);gap:12px;padding:11px 18px;border-bottom:1px solid var(--line);align-items:center}
.medrow>:last-child{text-align:right}
.medrow>:last-child .row{justify-content:flex-end}
.medrow:last-child{border-bottom:none}
.corregida{text-decoration:line-through;opacity:.6}
/* Documentos: zona para soltar el archivo y filas anuladas */
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;border:1.5px dashed var(--line);border-radius:var(--radius-m);padding:24px 16px;text-align:center;color:var(--ink-2);background:var(--sunk);cursor:pointer}
.drop:hover,.drop.over{border-color:var(--primary);background:var(--primary-soft)}
.drop.ok{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.drop b{color:var(--ink);font-weight:600;overflow-wrap:anywhere}
.btn.camara{display:none;justify-content:center;gap:8px;align-items:center}
tr.anulado td{opacity:.6}
.docref{display:inline-flex;gap:10px;align-items:center;margin-top:8px;padding:8px 12px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--surface);cursor:pointer;text-align:left;font:inherit}
.docref:hover{border-color:var(--primary)}
.docref small{display:block;color:var(--ink-3)}
.entry.anulado .docref b{text-decoration:line-through}
tr.anulado td:first-child b{text-decoration:line-through}
.modal.wide{width:min(860px,100%)}
/* Vista previa: lo que todavía no existe pero se puede recorrer. Borde punteado = no es una función disponible. */
.preview{border:1.5px dashed var(--line);border-radius:var(--radius-m);overflow:hidden}
.preview-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:9px 14px;background:var(--sunk);font-size:.82rem;color:var(--ink-2);border-bottom:1.5px dashed var(--line)}
.preview-b{padding:14px;display:grid;grid-template-columns:1fr 290px;gap:18px;align-items:start}
.preview-b.una{grid-template-columns:1fr}
.preview-n{padding:10px 14px;border-top:1px solid var(--line);font-size:.8rem;color:var(--ink-3)}
/* Celular simulado del paciente */
.phone{border:7px solid var(--ink);border-radius:26px;background:var(--sunk);overflow:hidden;display:flex;flex-direction:column;min-height:400px}
.phone-top{background:var(--surface);padding:10px 14px;font-size:.82rem;font-weight:600;border-bottom:1px solid var(--line)}
.phone-top small{display:block;font-weight:400;color:var(--ink-3)}
.chat{flex:1;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:.84rem}
.bub{max-width:88%;padding:8px 11px;border-radius:12px;background:var(--surface);border:1px solid var(--line);white-space:pre-line}
.bub.out{align-self:flex-end;background:var(--primary-soft);border-color:transparent}
.phone-act{display:flex;flex-direction:column;gap:6px;padding:10px 12px;background:var(--surface);border-top:1px solid var(--line)}
.walist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.walist button{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;padding:9px 12px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--surface);cursor:pointer;font:inherit}
.walist button[aria-pressed=true]{border-color:var(--primary);background:var(--primary-soft)}
@media (max-width:900px){.preview-b{grid-template-columns:1fr}}
@media (max-width:900px){.btn.camara{display:flex}}
/* Modal */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.scrim.open{display:flex}
.modal{background:var(--surface);border-radius:14px;width:min(560px,100%);max-height:calc(100% - 40px);overflow:auto;border:1px solid var(--line)}
.modal .mh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal .mb{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.88rem;opacity:0;transition:opacity .2s, transform .2s;z-index:60;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.rule{display:grid;grid-template-columns:28px 1fr auto;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);align-items:center}
.rule:last-child{border-bottom:none}
.rule .n{font-variant-numeric:tabular-nums;color:var(--ink-3)}

/* Panel del día */
.counters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}
.counter{cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px;display:flex;flex-direction:column;gap:2px;text-align:left;font:inherit;color:inherit}
.counter:hover{border-color:var(--ink-3)}
.counter[aria-pressed="true"]{border:2px solid var(--brand);padding:13px 17px}
.counter b{font-size:1.65rem;letter-spacing:-.02em;font-weight:700}
.counter.warn b{color:var(--warn)}
.counter span{font-size:.84rem;color:var(--ink-2)}
.panelgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.lhead{display:flex;align-items:center;gap:8px;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.lhead select{width:auto;margin-left:auto}
.trow{display:grid;grid-template-columns:52px minmax(0,1.3fr) minmax(0,1.2fr) minmax(0,1.1fr) 118px 156px;gap:14px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.thead{font-size:.78rem;color:var(--ink-3);font-weight:500;padding-top:9px;padding-bottom:9px}
.tgroup{padding:8px 18px;background:var(--sunk);border-bottom:1px solid var(--line);font-size:.74rem;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em}
.tgroup span{color:var(--ink-3);margin-left:6px}
.c-hora{font-weight:600;font-variant-numeric:tabular-nums}
.c-pac b{display:block;font-weight:600}
.c-pac small,.c-cob small{color:var(--ink-3);font-size:.8rem}
.c-cob{display:flex;flex-direction:column;align-items:flex-start;gap:4px;font-size:.88rem}
.c-cob .tag{white-space:normal}
.c-pro{display:flex;align-items:center;gap:8px;font-size:.86rem;color:var(--ink-2);white-space:nowrap;overflow:hidden}
.c-act{display:flex;justify-content:flex-end;gap:6px}
.hmob{display:none}
.btn.soft{background:var(--primary-soft);border-color:var(--primary-soft);color:var(--primary);font-weight:600}
.btn.soft:hover{border-color:var(--primary)}
.btn.icon{padding:7px 9px;line-height:1}
.lfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;background:var(--sunk);font-size:.86rem;color:var(--ink-2);flex-wrap:wrap}
.proh{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.proh:last-child{border-bottom:none}

// Devuelve qué prestación se presenta, si viene de una excepción y por qué.
// La regla es la fuente; la excepción es un caso puntual con motivo, y queda a la vista.
function moduloPac(p){
  const reg=modulo(S,p,true);
  if(p.moduloExc)return {valor:p.moduloExc.prest,excepcion:true,
    motivo:'Excepción cargada por '+p.moduloExc.por+' el '+fd(p.moduloExc.fecha)+': '+p.moduloExc.motivo+'. Por reglas correspondería '+reg.valor+'.'};
  return {valor:reg.valor,excepcion:false,motivo:reg.motivo};
}
function modulo(st,p,detalle){
  if(!detalle&&p.moduloExc)return p.moduloExc.prest;
  let i=0;
  for(const r of st.reglas){
    i++;
    if(r.ooss.op==='igual'&&p.ooss!==r.ooss.v)continue;
    if(r.ooss.op==='distinta'&&p.ooss===r.ooss.v)continue;
    if(r.estados.length&&!r.estados.includes(p.estado))continue;
    if(r.modalidad&&p.modalidad!==r.modalidad)continue;
    if(r.minFrec&&p.frecuencia<r.minFrec)continue;
    const v=r.res==='=estado'?p.estado:r.res;
    return detalle?{valor:v,motivo:'Según la regla '+i+' de cobertura.'}:v;
  }
  return detalle?{valor:'No definido',motivo:'Ninguna regla de cobertura coincide. Hay que resolverlo antes de cerrar el período.'}:'No definido';
}

const tomasHoy=()=>S.admins.filter(a=>a.fecha===TODAY&&!reemplazada(a));

const puedeRegistrar=()=>['enfermeria','direccion'].includes(S.role);
const hm2m=s=>{const [h,m]=s.split(':');return +h*60+ +m};
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
// Atrasada: pasaron más de 30 minutos del horario previsto
const atrasada=h=>nowMin()-(+h*60)>30;
// La hora de administración no puede ser futura ni anterior a 2 horas antes del horario previsto
const horaInvalida=(v,h)=>{if(!/^\d{2}:\d{2}$/.test(v||''))return 'Cargá la hora en que se administró';const m=hm2m(v);
  if(m>nowMin())return 'La hora no puede ser posterior a ahora';

// Vista previa ficticia para los documentos de la demo: una hoja con los datos del documento.

  const p=pat(d.pid);const t=docTipo(d.tipo);
  const lin=Array.from({length:9},(_,i)=>`<rect x="60" y="${330+i*34}" width="${380-(i*53)%140}" height="10" rx="5" fill="#E4E6E5"/>`).join('');
  const s=`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="760" viewBox="0 0 600 760"><rect width="600" height="760" fill="#fff"/>

// Elegir o soltar un archivo en la ventana "Subir documento"
function setUp(f){
  if(!f)return;
  if(!(f.type.startsWith('image/')||f.type==='application/pdf')){toast('Subí un PDF o una imagen');return}
  if(f.size>10*1024*1024){toast('El archivo pesa más de 10 MB');return}
  _up=f;const z=$('#drop');if(!z)return;z.classList.add('ok');
  const kb=f.size/1024;const tam=kb<1024?Math.max(1,Math.round(kb))+' KB':(kb/1024).toFixed(1).replace('.',',')+' MB';
  $('#dropT').textContent=f.name;$('#dropS').textContent=tam+' · tocá para cambiarlo';
}

/* ---------- métricas ---------- */
function metrics(){
  const r=R();const mine=t=>!esPro()||t.pro===r.proId;
  const hoy=S.turnos.filter(t=>t.fecha===TODAY&&mine(t));
  const d30=iso(day(-30));const pas=S.turnos.filter(t=>t.fecha>=d30&&t.fecha<=TODAY&&!['programado','cancelado'].includes(t.estado)&&mine(t));
  const asis=pas.length?Math.round(pas.filter(t=>t.estado==='presente').length/pas.length*100):0;
  const pend=S.turnos.filter(t=>t.estado==='presente'&&(!t.flujo||t.flujo==='atendido')&&mine(t)&&!S.evols.some(e=>e.turnoId===t.id));
  const vencen=S.auths.filter(a=>a.estado==='Autorizada'&&diff(a.vence,TODAY)<=15&&diff(a.vence,TODAY)>=0);
  // Los pedidos hechos con anticipación para meses futuros no son urgentes: no cuentan como "sin respuesta"
  const solicitadas=S.auths.filter(a=>a.estado==='Solicitada'&&a.periodo<=TODAY.slice(0,7));
  const hN=new Date().getHours();
  const medPend=[];S.esquemas.filter(vigente).forEach(e=>e.horas.forEach(h=>{if(+h<=hN&&!S.admins.some(a=>a.eid===e.id&&a.fecha===TODAY&&a.hora===h))medPend.push({e,h})}));
  const cortos=occ().filter(([,b])=>b.autorizados-diff(TODAY,b.ingreso)<=5);
  const nodef=S.pats.filter(p=>['En tratamiento','Admisión','Preadmisión','Alta'].includes(p.estado)&&S.turnos.some(t=>t.pid===p.id&&t.fecha.slice(0,7)===TODAY.slice(0,7)&&t.estado==='presente')&&modulo(S,p)==='No definido');
  return {hoy,asis,pend,vencen,solicitadas,medPend,cortos,nodef};
}

/* ---------- Agenda ---------- */
function vAgenda(){
  const r=R();const fixed=esPro();
  const agPros=S.pros.filter(x=>x.activo!==false&&x.disc!=='Enfermería'&&(x.horarios||[]).length);
  S.agPro=fixed?r.proId:(S.agPro||'p1');
  if(!fixed&&!agPros.some(x=>x.id===S.agPro))S.agPro=(agPros[0]||{id:'p1'}).id;
  S.agWeek=S.agWeek||0;
  const mon=day(-((T0.getDay()+6)%7)+S.agWeek*7);
  const days=[0,1,2,3,4].map(i=>{const d=new Date(mon);d.setDate(d.getDate()+i);return iso(d)});
  const hours=[];for(let h=8;h<19;h++){hours.push(String(h).padStart(2,'0')+':00');hours.push(String(h).padStart(2,'0')+':30')}
  const P=pro(S.agPro);
  // Franjas de atención del profesional para esa fecha, según los horarios de su ficha
  const franjas=f=>(P.horarios||[]).filter(x=>x.dia===new Date(f+'T00:00').getDay());
  const ts=S.turnos.filter(t=>t.pro===S.agPro&&days.includes(t.fecha));
  const cell=(d,h)=>{
    const t=ts.find(x=>x.fecha===d&&x.hora===h);
    const inPl=franjas(d).some(f=>h>=f.desde&&h<=f.hasta);
    if(t)return `<div class="cell" data-a="turno" data-t="${t.id}" role="button" tabindex="0"><div class="slot ${t.estado}">${esc(pat(t.pid).apellido)}<small>${esc(t.tipo)}</small></div></div>`;
    if(!inPl)return '<div class="cell off"></div>';
    return `<div class="cell free" data-a="newturno" data-d="${d}" data-h="${h}" role="button" tabindex="0" aria-label="Turno libre ${fd(d)} ${h}"></div>`;
  };
  return `<div class="head"><div><h1>Agenda</h1><p>${fixed?'Tus turnos de la semana':'Plantilla y turnos por profesional'} · franjas de 30 minutos</p></div>
    <div class="row">${fixed?'':`<select data-c="agpro" aria-label="Profesional" style="width:auto">${agPros.map(p=>`<option value="${p.id}" ${p.id===S.agPro?'selected':''}>${esc(p.nombre)} — ${p.disc}</option>`).join('')}</select>`}
    <button class="btn" data-a="wk" data-d="-1" aria-label="Semana anterior">‹</button><button class="btn" data-a="wk" data-d="0">Esta semana</button><button class="btn" data-a="wk" data-d="1" aria-label="Semana siguiente">›</button></div></div>
  <div class="panel"><div class="panel-h"><div class="row"><span class="dot" style="background:var(${DISC[P.disc]})"></span><b>${esc(P.nombre)}</b><span class="small muted">Atiende ${esc(horResumen(P))}</span></div>
    <div class="row small"><span class="tag">Programado</span><span class="tag ok">Presente</span><span class="tag danger">Ausente</span></div></div>
  <div class="tablewrap"><div class="week">
    <div class="hd"></div>${days.map(d=>`<div class="hd ${d===TODAY?'today':''}">${fd(d)}</div>`).join('')}
    ${hours.map(h=>`<div class="hr">${h}</div>${days.map(d=>cell(d,h)).join('')}`).join('')}
  </div></div></div>`;
}

// Horarios agrupados: junta los días que comparten franja y sede ("Lun a Vie 09:00 a 12:30")
function horGrupos(pr){
  const m={};(pr.horarios||[]).forEach(h=>{const k=h.desde+'|'+h.hasta+'|'+h.sede;(m[k]=m[k]||[]).push(h.dia)});
  return Object.entries(m).map(([k,ds])=>{const [desde,hasta,sede]=k.split('|');ds.sort((a,b)=>a-b);
    const seguidos=ds.length>2&&ds.every((d,i)=>i===0||d===ds[i-1]+1);
    return {dias:seguidos?DIAS_C[ds[0]]+' a '+DIAS_C[ds[ds.length-1]]:ds.map(d=>DIAS_C[d]).join(', '),desde,hasta,sede};});
}

function medHoy(){
  const hN=new Date().getHours();
  const cur=HORAS_MED.filter(h=>+h<=hN).pop()||HORAS_MED[0];
  const canReg=puedeRegistrar();
  const internados=e=>occ().some(([,b])=>b.pid===e.pid);
  const prn=S.esquemas.filter(e=>vigente(e)&&e.prn&&internados(e));
  const bloques=HORAS_MED.map(h=>{
    const rows=S.esquemas.filter(e=>vigente(e)&&!e.prn&&e.horas.includes(h)&&internados(e));
    if(!rows.length)return '';
    return `<div class="hourblock ${h===cur?'now':''}"><section class="panel"><div class="panel-h"><h2>${h}:00 hs</h2>${h===cur?'<span class="tag pri">Horario actual</span>':+h>hN?'<span class="small faint">Más tarde</span>':''}</div>
    ${rows.map(e=>`<div class="medrow"><div><b>${esc(pname(pat(e.pid)))}</b></div>
      <div>${esc(e.med)} ${esc(e.dosis)} · ${esc(e.via)}<div class="small faint">Indicó ${esc(pro(e.indica).nombre)}${e.indicaciones?' · '+esc(e.indicaciones):''}</div></div>
      <div>${tomaCtrl(e,h)}</div></div>`).join('')}
    </section></div>`}).join('');
  const bloquePrn=prn.length?`<section class="panel" style="margin-top:20px"><div class="panel-h"><h2>A demanda</h2><span class="small faint">Se registran cuando hacen falta, sin horario fijo</span></div>
    ${prn.map(e=>{const hoy=tomasHoy().filter(x=>x.eid===e.id);
      return `<div class="medrow"><div><b>${esc(pname(pat(e.pid)))}</b></div>
      <div>${esc(e.med)} ${esc(e.dosis)} · ${esc(e.via)}<div class="small faint">${esc(e.indicaciones||'Sin indicaciones adicionales')}</div></div>
      <div>${hoy.length?`<span class="tag ok">${hoy.length} toma${hoy.length>1?'s':''} hoy</span><div class="small faint">${hoy.map(a=>a.adm||a.ts).join(' · ')}</div>`:'<span class="small faint">Sin tomas hoy</span>'}
        ${canReg?`<button class="btn sm" data-a="admprn" data-e="${e.id}">Registrar toma</button>`:''}</div></div>`}).join('')}
    </section>`:'';
  return (bloques||'<div class="empty">No hay esquemas vigentes para los pacientes internados.</div>')+bloquePrn;
}

function medEsquemas(){
  const internados=occ().map(([c,b])=>({cama:c,p:pat(b.pid)})).filter(x=>x.p);
  const puede=puedeIndicar();
  if(!internados.length)return '<div class="empty">No hay pacientes internados.</div>';
  return internados.map(({cama,p})=>{

// Lo que se muestra para una toma programada: su registro, o los botones para registrarla.
// Se puede registrar desde una hora antes del horario previsto. Si está atrasada, el botón pide la hora real.
function tomaCtrl(e,h){
  const a=tomaDe(e.id,h);
  if(a)return tomaTag(a);
  const late=atrasada(h);
  if(!puedeRegistrar())return `<span class="tag ${late?'danger':''}">${late?'Sin registrar':'Pendiente'}</span>`;
  const desde=+h-1;
  if(nowMin()<desde*60)return `<button class="btn sm" disabled>Desde las ${String(desde).padStart(2,'0')}:00</button>`;
  return `<div class="row" style="gap:6px">${late?'<span class="tag danger">Atrasada</span>':''}<button class="btn sm pri" data-a="adm" data-e="${e.id}" data-h="${h}" data-v="1">Administrada</button><button class="btn sm" data-a="adm" data-e="${e.id}" data-h="${h}" data-v="0">No administrada</button>${late?'':`<button class="btn sm ghost" data-a="admhora" data-e="${e.id}" data-h="${h}">Otra hora</button>`}</div>`;
}
// Etiqueta de una toma registrada. Si se cargó más tarde, muestra también la hora de registro.
function tomaTag(a){
  const hz=a.adm||a.ts;
  return `<span class="tag ${a.estado==='Administrada'?'ok':'danger'}">${a.estado} ${hz||''}</span>`
    +(a.adm&&a.adm!==a.ts?`<div class="small faint">registrada ${a.ts}</div>`:'')
    +(a.reemplaza?`<div class="small faint">Hora corregida: ${esc(a.motivoCorr)}</div>`:'')
    +(a.motivo?`<div class="small faint">${esc(a.motivo)}</div>`:'')

}
// Una fila de esquema, vigente o cerrado. Los cerrados no se ocultan: quedan como historial.

}

/* ---------- Autorizaciones ---------- */
/* ---------- Períodos: selector de mes ---------- */
// Autorizaciones y Prefacturación comparten el mes elegido (S.periodo). Se puede mirar 5 meses atrás y 3 adelante.
const MES_ATRAS=5,MES_ADELANTE=3;
const mesAdd=(m,n)=>{const d=new Date(m+'-01T00:00');d.setMonth(d.getMonth()+n);return iso(d).slice(0,7)};
const mesNom=m=>{const s=MESL[+m.slice(5)-1]+' '+m.slice(0,4);return s[0].toUpperCase()+s.slice(1)};
const finMes=m=>iso(new Date(+m.slice(0,4),+m.slice(5),0));
const dmas=(s,n)=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return iso(d)};
const periodo=()=>S.periodo||TODAY.slice(0,7);
// cerrado: tiene foto de cierre · abierto: terminó y falta cerrarlo · curso: el mes actual · futuro
function mesEstado(m){const hoy=TODAY.slice(0,7);if(S.cierres[m])return 'cerrado';if(m<hoy)return 'abierto';if(m===hoy)return 'curso';return 'futuro'}
function mesSel(){
  const cur=periodo();const hoy=TODAY.slice(0,7);const ops=[];for(let i=-MES_ATRAS;i<=MES_ADELANTE;i++)ops.push(mesAdd(hoy,i));
  const i=ops.indexOf(cur);const est=mesEstado(cur);const ci=S.cierres[cur];
  const etiq={cerrado:ci?`<span class="tag ok">Cerrado el ${fd(ci.fecha)} por ${esc(ci.por)}</span>`:'',abierto:'<span class="tag warn">Pendiente de cierre</span>',curso:'<span class="tag pri">Mes en curso</span>',futuro:'<span class="tag">Mes futuro</span>'}[est];
  return `<div class="messel" role="group" aria-label="Mes">
    <button class="btn icon" data-a="mes" data-v="${ops[i-1]||''}" ${i<=0?'disabled':''} aria-label="Mes anterior">${ico('cl',17)}</button>
    <select data-c="mes" aria-label="Elegir mes">${ops.map(m=>`<option value="${m}" ${m===cur?'selected':''}>${mesNom(m)}</option>`).join('')}</select>
    <button class="btn icon" data-a="mes" data-v="${ops[i+1]||''}" ${i>=ops.length-1?'disabled':''} aria-label="Mes siguiente">${ico('cr',17)}</button>
    ${etiq}${cur!==hoy?`<button class="btn sm ghost" data-a="mes" data-v="${hoy}">Ir al mes actual</button>`:''}</div>`;
}

  const sub={cerrado:'Período cerrado: lo presentado ya no cambia. El cobro se sigue registrando.',abierto:'El mes terminó y falta cerrar la prefacturación.',

      ${edit?`<button class="btn sm" data-a="pedirauth" data-p="${p.id}">Registrar pedido</button>`:''}</div>`).join('')||'<div class="small faint" style="padding:6px">Todos tienen su pedido</div>'}</div>`:'';
  return `<div class="head"><div><h1>Autorizaciones</h1><p>${sub}</p></div>
    <div class="chips">${['',...S.ooss.filter(o=>o!=='Particular')].map(o=>`<button class="chip" data-a="aoo" data-v="${o}" aria-pressed="${fo===o}">${o||'Todas'}</button>`).join('')}${proxBtn('osonline','Pedir en línea')}</div></div>

    ${cs.map(a=>{const p=pat(a.pid);const used=S.turnos.filter(t=>t.pid===a.pid&&t.fecha.slice(0,7)===a.periodo&&t.estado==='presente').length;const dv=diff(a.vence,TODAY);const nx=AUTH_ST[AUTH_ST.indexOf(st)+1];
      return `<div class="card"><b style="cursor:pointer" data-a="openp" data-p="${p.id}" data-tab="datos">${esc(pname(p))}</b><div class="small muted">${esc(a.ooss)} · ${esc(a.prest)}</div>

}

/* ---------- Prefacturación ---------- */
// Prefacturación de un mes. Cerrado: la foto guardada al cerrar, que no cambia.
// Abierto o en curso: se calcula con la asistencia real, las reglas de cobertura y el tarifario.
// Futuro: estimación con la frecuencia semanal de cada paciente.
function prefact(m){
  const est=mesEstado(m);
  if(est==='cerrado')return S.cierres[m].rows;
  const price=(o,pr)=>(S.tarifario.find(t=>t.ooss===o&&t.prest===pr)||{}).precio;
  const ini=m+'-01',fin=finMes(m);
  return S.pats.map(p=>{
    const bed=occ().find(([,b])=>b.pid===p.id);let ses=0,dias=0;
    if(est==='futuro'){
      if(['Preadmisión','Alta','Baja'].includes(p.estado))return null;
      ses=Math.round((p.frecuencia||1)*4.3);if(bed)dias=diff(dmas(fin,1),ini);
    }else{
      ses=S.turnos.filter(t=>t.pid===p.id&&t.fecha>=ini&&t.fecha<=fin&&t.estado==='presente').length;
      // Días internado dentro del mes: desde el ingreso (o el 1°) hasta hoy (o fin de mes)

    <div class="row" style="flex-wrap:nowrap"><div class="bar" style="flex:1"><i style="width:${Math.round(done/ts.length*100)}%"></i></div><span class="faint" style="white-space:nowrap;font-size:12px">${done} de ${ts.length} turnos</span></div></div>`}).join('');
  const todos=[];

  reprog.forEach(t=>todos.push(`<button class="todo" data-a="tacc" data-t="${t.id}"><span class="ic">${ico('agenda')}</span><span><span style="display:block;font-size:14px">${esc(pat(t.pid).nombre+' '+pat(t.pid).apellido)} pide reprogramar</span><span class="faint" style="font-size:12px">Turno de las ${t.hora} · respondió por WhatsApp (vista previa)</span></span></button>`));
  if(sinconf.length)todos.push(`<button class="todo" data-a="wa"><span class="ic">${ico('bell')}</span><span><span style="display:block;font-size:14px">${sinconf.length} turno${sinconf.length>1?'s':''} sin confirmar</span><span class="faint" style="font-size:12px">Ver cómo funcionará el recordatorio por WhatsApp</span></span></button>`);
  if(sinEv.length)todos.push(`<button class="todo" data-a="pnf" data-v="atendidos"><span class="ic" style="color:var(--ink-2)">${ico('pen')}</span><span><span style="display:block;font-size:14px">${sinEv.length} ${sinEv.length>1?'evoluciones':'evolución'} sin escribir</span><span class="faint" style="font-size:12px">De turnos atendidos hoy</span></span></button>`);
  return `<div class="head" style="align-items:flex-end"><div><h1>Panel del día</h1><p>${fdl(TODAY)} · Sede central · ${all.length} turnos</p></div>
    <div class="row"><div class="row" style="gap:4px"><button class="btn icon" data-a="soon" data-m="En la demo se muestra solo el día de hoy." aria-label="Día anterior">${ico('cl',17)}</button><button class="btn">Hoy</button><button class="btn icon" data-a="soon" data-m="En la demo se muestra solo el día de hoy." aria-label="Día siguiente">${ico('cr',17)}</button></div>
    <button class="btn" data-a="soon" data-m="Bloqueá un horario de un profesional o consultorio: los turnos de esa franja quedan fuera de la agenda.">${ico('lock',17)}Bloquear horario</button>${vpBtn('whatsapp','Recordatorios por WhatsApp','wa')}<button class="btn pri" data-a="go" data-v="agenda">${ico('plus',17,2)}Nuevo turno</button></div></div>
  <div class="counters">${cnt('espera',esp.length,'en sala de espera',false)}${cnt('espera15',esp15.length,'espera más de 15 minutos',true)}${cnt('sinconf',sinconf.length,'turnos sin confirmar',true)}<button class="counter ${venc.length?'warn':''}" data-a="go" data-v="autorizaciones"><b>${venc.length}</b><span>autorizaciones por vencer</span></button></div>
  <div class="panelgrid"><section class="panel" style="overflow:hidden">
    <div class="lhead">${chip('todos','Todos',all.length)}${chip('espera','Esperando',G.espera.length)}${chip('porllegar','Por llegar',G.porllegar.length)}${chip('consulta','En consulta',G.consulta.length)}${chip('atendidos','Atendidos',G.atendidos.length)}
    <select class="fsel" data-c="pnpro" aria-label="Filtrar por profesional"><option value="">Profesionales</option>${['p1','p2','p3','p4'].map(id=>`<option value="${id}" ${fp===id?'selected':''}>${esc(pro(id).nombre)}</option>`).join('')}</select></div>
    <div class="trow thead"><span>Hora</span><span>Paciente</span><span>Cobertura</span><span>Profesional</span><span>Estado</span><span></span></div>
    ${body}
    ${f==='todos'?`<div class="lfoot"><span>Atendidos · ${G.atendidos.length}${sinEv.length?` · <span style="color:#8A6100;font-weight:500">${sinEv.length} sin evolución escrita</span>`:''}</span><button class="btn sm ghost" data-a="pnf" data-v="atendidos" style="font-weight:600">Ver atendidos</button></div>`:''}
  </section>
  <aside class="stack">
    <section class="panel" style="overflow:hidden"><div class="aside-h"><h2>Profesionales hoy</h2><span class="faint" style="font-size:12px">${ids.length} atienden</span></div>${profs}</section>
    <section class="panel" style="overflow:hidden"><div class="aside-h"><h2>Para resolver hoy</h2></div>${todos.join('')||'<div class="empty">Nada pendiente.</div>'}</section>
  </aside></div>`;
}
function vMiDia(m){
  const me=R().proId;const mine=todayT().filter(t=>t.pro===me);
  const cur=mine.find(t=>t.flujo==='consulta');
  const next=mine.find(t=>t.flujo==='espera')||mine.find(t=>t.flujo==='porllegar');
  const later=mine.filter(t=>t.flujo==='porllegar'&&t!==next);
  const done=mine.filter(t=>t.flujo==='atendido'||t.flujo==='ausente');
  const pend=m.pend;
  const pn=t=>esc(pname(pat(t.pid)));
  const curCard=cur?`<section class="panel nowcard"><div class="row" style="justify-content:space-between"><span class="lab">En consulta · ${cur.hora}</span><span class="tag pri">${minsSince(cur.ini)} min</span></div>
      <div><h2>${esc(pat(cur.pid).nombre+' '+pat(cur.pid).apellido)}</h2><p class="small muted">${esc(cur.tipo)} · ${esc(cobLabel(cur).o)}</p></div>
      <div class="twobtn"><button class="btn pri" data-a="newev" data-p="${cur.pid}" data-t="${cur.id}">Evolución</button><button class="btn" data-a="finalizar" data-t="${cur.id}">Finalizar</button><button class="btn" data-a="openp" data-p="${cur.pid}">Ver historia</button></div></section>`
    :`<section class="panel nowcard"><span class="lab muted">En consulta</span><p class="muted">No tenés a nadie en consulta ahora.</p></section>`;
  const nextCard=next?`<section class="panel nowcard"><span class="lab muted">Siguiente · ${next.hora}</span>
      <div class="row" style="justify-content:space-between"><div><h2 style="font-size:1.2rem">${esc(pat(next.pid).nombre+' '+pat(next.pid).apellido)}</h2><p class="small muted">${esc(next.tipo)} · ${esc(cobLabel(next).o)}</p></div>${estTagF(next)}</div>
      ${next.flujo==='espera'?`<button class="btn soft" style="min-height:44px" data-a="pasar" data-t="${next.id}" ${cur?'disabled title="Finalizá la consulta actual primero"':''}>Hacer pasar</button>`:''}</section>`:'';
  const li=(t,extra)=>`<div class="agenda-row"><time>${t.hora}</time><div><div>${pn(t)}</div><div class="small muted">${esc(t.tipo)}</div></div>${extra}</div>`;
  return `<div class="head"><div><h1>Mi día</h1><p>${fdl(TODAY)} · ${mine.length} turnos</p></div></div>
  ${pend.length?`<div class="banner" style="background:var(--warn-soft);color:var(--warn)"><span>${pend.length} evolución${pend.length>1?'es':''} sin escribir</span><button class="btn sm" data-a="newev" data-p="${pend[0].pid}" data-t="${pend[0].id}">Escribir la primera</button></div>`:''}
  <div class="grid2"><div class="stack">${curCard}${nextCard}</div>
  <div class="stack"><section class="panel"><div class="panel-h"><h2>Más tarde</h2></div>${later.map(t=>li(t,estTagF(t))).join('')||'<div class="empty">No quedan más turnos hoy.</div>'}</section>
  <section class="panel"><div class="panel-h"><h2>Atendidos hoy</h2></div>${done.map(t=>li(t,t.flujo==='ausente'?'<span class="tag danger">Ausente</span>':S.evols.some(e=>e.turnoId===t.id)?'<span class="tag ok">Con evolución</span>':`<button class="btn sm" data-a="newev" data-p="${t.pid}" data-t="${t.id}">Escribir evolución</button>`)).join('')||'<div class="empty">Todavía no atendiste pacientes hoy.</div>'}</section></div></div>`;
}

function esqModal(e,pid){
  const meds=[...new Set(MEDS.map(m=>m[0]))].sort();
  const sel=e?e.med:'';
  modal(e?'Cambiar medicación':'Indicar medicación',`<p class="small muted">${esc(pname(pat(pid)))}</p>
    ${e?'<p class="small faint">Al guardar, el esquema actual queda suspendido y se registra esta indicación como versión nueva. Las tomas ya registradas no se modifican.</p>':''}
    <div class="fgrid">
      <label class="f">Medicamento<select id="mMed"><option value="">— Elegir —</option>${meds.map(m=>`<option ${m===sel?'selected':''}>${m}</option>`).join('')}</select></label>
      <label class="f">Dosis<input type="text" id="mDos" value="${e?esc(e.dosis):''}" placeholder="50 mg"></label>
      <label class="f">Vía<select id="mVia">${VIAS.map(v=>`<option ${e&&e.via===v?'selected':''}>${v}</option>`).join('')}</select></label></div>
    <label class="f" style="margin-top:12px">Horarios
      <div class="chips">${HORAS_MED.map(h=>`<label class="chip" style="cursor:pointer"><input type="checkbox" id="mH${h}" ${e&&e.horas.includes(h)?'checked':''} style="margin-right:6px">${h}:00</label>`).join('')}</div></label>
    <label class="f" style="flex-direction:row;align-items:center;gap:8px;margin-top:10px">
      <input type="checkbox" id="mPrn" ${e&&e.prn?'checked':''}>A demanda: se da cuando hace falta, sin horario fijo</label>
    <label class="f">Indicaciones<input type="text" id="mInd" value="${e?esc(e.indicaciones||''):''}" placeholder="Opcional: cómo o cuándo darla"></label>`,
    `<button class="btn" data-a="close">Cancelar</button><button class="btn pri" data-a="saveesq" data-p="${pid}" ${e?`data-e="${e.id}"`:''}>${e?'Guardar cambio':'Indicar'}</button>`)
}

  wa:()=>{

    if(!ts.length){toast('No hay turnos de hoy sin confirmar');return}
    const sel=ts.find(t=>t.id===S.waSel)||ts[0];S.waSel=sel.id;const p=pat(sel.pid);
    const RESP={'1':['Confirmo','¡Gracias! Tu turno quedó confirmado. Te esperamos.'],'2':['Quiero reprogramar','Recibimos tu pedido. Recepción te va a escribir para coordinar otro horario.'],'3':['Cancelo','Tu turno quedó cancelado. Si querés otro turno, escribinos por acá.']};
    const r=sel.wa?RESP[sel.wa]:null;
    modal('Recordatorios por WhatsApp',`<div class="preview">${vpHead('whatsapp')}<div class="preview-b">
      <div><p class="small muted">Turnos de hoy sin confirmar. Elegí uno para ver el mensaje que recibe el paciente y probá sus respuestas.</p>
        <div class="walist">${ts.map(t=>`<button data-a="wasel" data-t="${t.id}" aria-pressed="${t.id===sel.id}"><span><b>${t.hora}</b> · ${esc(pat(t.pid).nombre+' '+pat(t.pid).apellido)}<br><span class="small faint">${esc(pro(t.pro).nombre)}</span></span>${t.wa?`<span class="tag ${t.wa==='1'?'ok':t.wa==='2'?'warn':''}">${RESP[t.wa][0]}</span>`:'<span class="tag warn">Sin respuesta</span>'}</button>`).join('')}</div>
        <p class="small faint" style="margin-top:12px">La respuesta cambia el turno en el Panel: confirma, lo deja para reprogramar o lo cancela y libera el horario.</p></div>
      <div class="phone"><div class="phone-top">Centro Demo de Salud Mental<small>WhatsApp de ${esc(p.nombre)}</small></div>
        <div class="chat"><div class="bub">Hola ${esc(p.nombre)}, te recordamos tu turno de hoy, ${esc(fd(sel.fecha))}, a las ${sel.hora} con ${esc(pro(sel.pro).nombre)} en Sede central.\n\nRespondé:\n1 · Confirmo\n2 · Quiero reprogramar\n3 · Cancelo</div>
        ${r?`<div class="bub out">${r[0]}</div><div class="bub">${r[1]}</div>`:''}</div>
        ${r?'':`<div class="phone-act"><span class="small faint">Respondé como si fueras ${esc(p.nombre)}:</span>${Object.entries(RESP).map(([k,v])=>`<button class="btn sm" data-a="waresp" data-t="${sel.id}" data-v="${k}">${k} · ${v[0]}</button>`).join('')}</div>`}</div></div>
      <div class="preview-n">Cuando exista, el recordatorio sale solo, 24 horas antes de cada turno. Cada mensaje tiene un costo que se cobra según el uso.</div></div>`,
      `<button class="btn pri" data-a="close">Cerrar</button>`);
    $('#modal').classList.add('wide')},

  // El PDF es una foto fechada: evoluciones firmadas y documentos de la HC (sin anulados), en orden cronológico.
  // Las imágenes van dentro del PDF. Los PDF cargados se listan como anexos: en el sistema real se agregan como páginas.
  printhc:d=>{const p=pat(d.p);
    const ev=S.evols.filter(e=>e.pid===p.id&&e.firmada);const dc=docsDeHc(p.id,false);
    const items=ev.map(e=>({e,k:e.fecha+e.hora})).concat(dc.map(doc=>({doc,k:doc.fecha+docHora(doc)}))).sort((a,b)=>a.k.localeCompare(b.k));
    let nAnexo=0;const anexos=[];
    const html=items.map(({e,doc})=>{
      if(e)return `<div class="pe"><div class="pm">${fd(e.fecha)} ${e.hora} hs · ${esc(e.tipo)} · ${esc(pro(e.pro).nombre)} (${pro(e.pro).mat})</div><div>${esc(e.texto)}</div>${e.addenda.map(a=>`<div class="pm">Adenda ${fd(a.fecha)}: ${esc(a.texto)}</div>`).join('')}<div class="pm">Firma electrónica · huella ${hash(e.id+e.texto)}</div></div>`;
      const t=docTipo(doc.tipo);const src=docSrc(doc);let cuerpo;
      if(doc.mime==='application/pdf'){nAnexo++;anexos.push(doc);cuerpo=`<div class="anexo">Anexo ${nAnexo}: ${esc(doc.archivo)} — se adjunta al final de la historia clínica.</div>`}
      else cuerpo=src?`<img src="${src}" alt="${esc(doc.titulo)}">`:`<div class="anexo">${esc(doc.archivo)} — la vista previa no está disponible en la demo.</div>`;
      return `<div class="pe"><div class="pm">${fd(doc.fecha)} · Documento · ${esc(t.nombre)} · cargado por ${esc(doc.por)} el ${fd(doc.subido.slice(0,10))}</div><div><b>${esc(doc.titulo)}</b></div>${cuerpo}<div class="pm">Huella ${hash(doc.id+doc.archivo)}</div></div>`}).join('');
    $('#print').innerHTML=`<h1>Historia clínica — ${esc(p.nombre+' '+p.apellido)}</h1><p class="pm">DNI ${p.dni} · ${esc(p.ooss)} · Centro Demo de Salud Mental · emitida el ${fdl(TODAY)} a las ${nowHM()} por ${esc(R().user)}</p>
      <p class="pm">Incluye ${ev.length} evoluciones firmadas y ${dc.length} documentos, en orden cronológico. Los borradores y los documentos anulados no se incluyen.</p>`+html
      +(anexos.length?`<div class="pe"><div class="pm">Anexos</div>${anexos.map((a,i)=>`<div class="pm">${i+1}. ${esc(a.archivo)} (${fd(a.fecha)})</div>`).join('')}<div class="pm">En la demo los anexos en PDF no se unen. En el sistema real se agregan como páginas al final de este documento.</div></div>`:'');
    audit('Exportó historia clínica',pname(p)+' — '+ev.length+' evoluciones y '+dc.length+' documentos');save();
    // Espera a que carguen las imágenes antes de imprimir
    Promise.all([...$('#print').querySelectorAll('img')].map(i=>i.decode().catch(()=>{}))).then(()=>window.print())},
  chstate:d=>{const p=pat(d.p);const nx=ESTADOS.filter(e=>e!==p.estado);

      <p class="small faint">El registro anterior no se borra: queda a la vista, tachado, junto al nuevo.</p>`,
      `<button class="btn" data-a="close">Cancelar</button><button class="btn pri" data-a="savecorr" data-id="${a.id}">Guardar corrección</button>`)},
  savecorr:d=>{const a=S.admins.find(x=>x.id===d.id);const e=S.esquemas.find(x=>x.id===a.eid);const v=$('#mHA').value;const mot=$('#mMC').value.trim();
    const err=horaInvalida(v,e.prn?null:a.hora);if(err){toast(err);return}
    if(v===(a.adm||a.ts)){toast('Es la misma hora que ya está registrada');return}
    if(!mot){toast('Cargá el motivo de la corrección');return}
    S.admins.push({...a,id:uid('a'),adm:v,ts:nowHM(),por:R().user,reemplaza:a.id,motivoCorr:mot});
    audit('Corrigió la hora de una toma',e.med+' — '+pname(pat(e.pid))+': '+(a.adm||a.ts)+' → '+v+' ('+mot+')');
    close();render();toast('Hora corregida')},
  advauth:d=>{const a=S.auths.find(x=>x.id===d.id);const nx=AUTH_ST[AUTH_ST.indexOf(a.estado)+1];audit('Autorización '+a.estado.toLowerCase()+' → '+nx.toLowerCase(),a.ooss+' — '+pname(pat(a.pid)));a.estado=nx;render();toast('Autorización '+nx.toLowerCase())},
  // Cerrar guarda la foto de la prefacturación y presenta las autorizaciones del mes
  cerrar:d=>{const m=d.m;if(mesEstado(m)!=='abierto')return;const rows=prefact(m);
    if(rows.some(r=>r.m==='No definido')){toast('Resolvé los pacientes sin regla antes de cerrar');return}
    S.cierres[m]={fecha:TODAY,hora:nowHM(),por:R().user,rows};
    const pres=S.auths.filter(a=>a.periodo===m&&a.estado==='Autorizada');pres.forEach(a=>a.estado='Presentada');
    audit('Cerró período de facturación',mesNom(m)+' — '+rows.length+' pacientes, '+money(rows.reduce((s,r)=>s+r.total,0))+(pres.length?' · '+pres.length+' autorizaciones pasaron a presentada':''));
    render();toast(mesNom(m)+' cerrado. Ya no se puede modificar.')},
  mes:d=>{if(!d.v)return;S.periodo=d.v;S.fOpen='';render()},
  pedirauth:d=>{const p=pat(d.p);const m=periodo();
    S.auths.push({id:uid('au'),pid:p.id,ooss:p.ooss,prest:modulo(S,p),periodo:m,autorizadas:p.modalidad==='Internación'?30:(p.frecuencia>=3?30:20),estado:'Solicitada',vence:finMes(m),via:'Portal OS'});
    audit('Registró pedido de autorización',p.ooss+' — '+pname(p)+' · '+mesNom(m));render();toast('Pedido registrado')},
  delrule:d=>{S.reglas=S.reglas.filter(r=>r.id!==d.id);audit('Eliminó regla de cobertura',d.id);render();toast('Regla quitada. Revisá la prefacturación.')},
  newrule:()=>modal('Nueva regla de cobertura',`<div class="fgrid"><label class="f">Obra social<select id="rO"><option value="">Cualquiera</option>${S.ooss.map(o=>`<option>${o}</option>`).join('')}</select></label>
    <label class="f">Estado del paciente<select id="rE"><option value="">Cualquiera</option>${ESTADOS.map(e=>`<option>${e}</option>`).join('')}</select></label>
    <label class="f">Modalidad<select id="rM"><option value="">Cualquiera</option><option>Ambulatorio</option><option>Internación</option></select></label>
    <label class="f">Presentar como<select id="rR">${S.prest.map(p=>`<option>${p}</option>`).join('')}</select></label></div>
    <p class="small faint">La regla nueva se agrega al principio de la lista, así tiene prioridad.</p>`,`<button class="btn" data-a="close">Cancelar</button><button class="btn pri" data-a="saverule">Agregar regla</button>`),
  saverule:()=>{const o=$('#rO').value,e=$('#rE').value;S.reglas.unshift({id:uid('r'),ooss:o?{op:'igual',v:o}:{op:'cualquiera',v:''},estados:e?[e]:[],modalidad:$('#rM').value,minFrec:0,res:$('#rR').value,nota:'Agregada en la demo'});audit('Agregó regla de cobertura',$('#rR').value);close();render();toast('Regla agregada')}
};
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-a]');if(!el)return;const f=A[el.dataset.a];if(f){if(el.dataset.a==='vitals')ev.stopPropagation();f(el.dataset,el,ev)}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')close();if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('[role=button],tr.click')){ev.preventDefault();ev.target.click()}});
document.addEventListener('input',ev=>{const c=ev.target.dataset.c;if(c==='pq'){S.pf.q=ev.target.value;const pos=ev.target.selectionStart;render();const i=$('[data-c=pq]');i.focus();i.setSelectionRange(pos,pos)}});
document.addEventListener('change',ev=>{if(ev.target.dataset.c==='agpro'){S.agPro=ev.target.value;render()}if(ev.target.dataset.c==='pnpro'){S.pnpro=ev.target.value;render()}
  if(ev.target.dataset.c==='docfile')setUp(ev.target.files[0]);
  if(ev.target.dataset.c==='mes'){S.periodo=ev.target.value;S.fOpen='';render()}
  if(ev.target.dataset.c==='tipohc'){const t=docTipo(ev.target.dataset.id);t.hc=ev.target.checked;
    audit('Cambió tipo de documento',t.nombre+': '+(t.hc?'forma parte':'no forma parte')+' de la historia clínica');render()}
  // Los pacientes particulares no tienen numero de afiliado
  if(ev.target.dataset.c==='nooss'){const i=$('#nAf');const part=ev.target.value==='Particular';i.disabled=part;i.placeholder=part?'No corresponde':'Como figura en la credencial';if(part)i.value=''}});
document.addEventListener('keydown',ev=>{if(ev.target.id==='gsearch'&&ev.key==='Enter'){const q=ev.target.value.trim();if(!R().views.includes('pacientes')){toast('Tu rol no tiene acceso a la lista de pacientes');return}S.pf={q,estado:'',mod:''};S.view='pacientes';ev.target.value='';render()}});
$('#scrim').addEventListener('click',ev=>{if(ev.target.id==='scrim')close()});
// Arrastrar y soltar un archivo en la ventana "Subir documento"
['dragover','dragleave','drop'].forEach(k=>document.addEventListener(k,ev=>{const z=ev.target.closest&&ev.target.closest('#drop');if(!z)return;ev.preventDefault();
  z.classList.toggle('over',k==='dragover');if(k==='drop')setUp(ev.dataTransfer.files[0])}));
render();
setInterval(()=>{if(S.view==='hoy'&&['administracion','profesional','psiquiatria'].includes(S.role)&&!$('#scrim').classList.contains('open')&&!(document.activeElement&&document.activeElement.matches('input,select,textarea')))render()},30000);
</script>
</body>
</html>
