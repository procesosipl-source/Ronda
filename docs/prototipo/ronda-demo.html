<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ronda — demo de gestión para centros de salud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --sunk:#F0F1F4; --line:#E5E7EB; --ink:#1F2328; --ink-2:#4B5563; --ink-3:#6B7280;
  --primary:#B8520A; --primary-ink:#FFFFFF; --primary-soft:#FFF1E6; --brand:#F07D00;
  --warn:#8A6100; --warn-soft:#FEF6D8; --danger:#B42318; --danger-soft:#FDECEA; --ok:#1E7A4C; --ok-soft:#E3F4EA;
  --d-psi:#2563EB; --d-psq:#7C3AED; --d-ts:#0891B2; --d-enf:#059669; --d-nut:#65A30D; --d-gru:#DB2777;
  --radius-s:8px; --radius-m:12px;
  --sans:"Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --serif:"Newsreader", Georgia, "Times New Roman", serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-0.01em}
h1{font-size:1.6rem} h2{font-size:1.15rem} h3{font-size:1rem}
p{margin:0}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);height:100%}
/* Sidebar */
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:22px 20px 14px;display:flex;align-items:flex-end;gap:8px}
.brand svg{display:block;height:30px;width:auto}
.brand b{font-size:1.45rem;font-weight:700;letter-spacing:-0.03em;display:flex;align-items:center;gap:8px}

.brand span{font-size:.8rem;color:var(--ink-3)}
.tenant{margin:0 12px 12px;padding:10px 12px;border-radius:var(--radius-m);background:var(--sunk);font-size:.85rem}
.tenant small{display:block;color:var(--ink-3);font-size:.75rem}
.nav{display:flex;flex-direction:column;padding:4px 8px;gap:2px;overflow:auto;flex:1}
.nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:var(--radius-s);color:var(--ink-2);display:flex;justify-content:space-between;align-items:center}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--primary-soft);color:var(--primary);font-weight:600;box-shadow:inset 3px 0 0 var(--brand)}
.nav button:focus-visible{outline:2px solid var(--primary)}
.nav .count{font-size:.75rem;background:var(--warn-soft);color:var(--warn);padding:1px 7px;border-radius:20px;font-weight:600}
.nav .sep{height:1px;background:var(--line);margin:8px 12px}
.side-foot{padding:12px 16px;border-top:1px solid var(--line);font-size:.8rem;color:var(--ink-3)}
.side-foot button{all:unset;cursor:pointer;color:var(--primary);text-decoration:underline}
/* Main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;padding:12px 28px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.top .who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:.88rem}
.rolepick{display:flex;background:var(--sunk);border-radius:var(--radius-m);padding:3px;gap:2px}
.rolepick button{all:unset;cursor:pointer;padding:6px 11px;border-radius:7px;font-size:.84rem;color:var(--ink-2)}
.rolepick button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.rolepick button:focus-visible{outline:2px solid var(--primary)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font-size:.78rem;font-weight:700}
.content{flex:1;overflow:auto;padding:28px}
.inner{max-width:1180px;margin:0 auto}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.head p{color:var(--ink-2);margin-top:4px}
/* Primitives */
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:var(--radius-s);font-size:.88rem;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 9px;font-size:.8rem}
.btn.ghost{border-color:transparent;background:transparent;color:var(--primary)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);box-shadow:0 1px 2px rgba(16,24,40,.04)}
.panel-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.panel-b{padding:14px 18px}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .small{font-size:.83rem}
.tag{display:inline-block;font-size:.76rem;padding:2px 8px;border-radius:20px;background:var(--sunk);color:var(--ink-2);font-weight:500;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.danger{background:var(--danger-soft);color:var(--danger)} .tag.pri{background:var(--primary-soft);color:var(--primary)}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px}
.stack{display:flex;flex-direction:column;gap:20px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;font-weight:500;color:var(--ink-3);font-size:.8rem;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
input[type=text],input[type=search],input[type=date],input[type=number],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-s);padding:7px 10px;width:100%}
textarea{font-family:var(--serif);font-size:1.02rem;line-height:1.55;min-height:130px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.84rem;color:var(--ink-2)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{cursor:pointer;border:1px solid var(--line);background:var(--surface);padding:4px 11px;border-radius:20px;font-size:.82rem;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--primary-soft);color:var(--primary);border-color:var(--primary)}
.bar{height:6px;border-radius:4px;background:var(--sunk);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--primary)}
.bar.warn i{background:var(--warn)} .bar.danger i{background:var(--danger)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.empty{padding:30px;text-align:center;color:var(--ink-2)}
/* Today */
.daystrip{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:var(--radius-m);background:var(--surface);margin-bottom:20px}
.daystrip div{padding:16px 18px;border-right:1px solid var(--line)}
.daystrip div:last-child{border-right:none}
.daystrip b{display:block;font-size:1.55rem;font-weight:600;letter-spacing:-0.02em}
.daystrip span{font-size:.84rem;color:var(--ink-2)}
.alert{display:flex;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
.alert:last-child{border-bottom:none}
.alert:hover{background:var(--sunk)}
.alert .k{width:4px;align-self:stretch;border-radius:3px;background:var(--warn);flex:none}
.alert .k.danger{background:var(--danger)}
.alert .k.info{background:var(--primary)}
.sigbox{margin-top:10px;border:1px dashed var(--line);border-radius:var(--radius-s);background:var(--sunk);padding:14px 16px;font-family:var(--serif);font-size:1.15rem;color:var(--ink)}
.sigbox small{display:block;font-family:var(--sans);font-size:.76rem;color:var(--ink-3);margin-top:2px}
.agenda-row{display:grid;grid-template-columns:60px 1fr auto;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line);align-items:center}
.agenda-row:last-child{border-bottom:none}
.agenda-row time{font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:.88rem}
.banner{display:flex;gap:14px;align-items:center;justify-content:space-between;background:var(--primary-soft);border-radius:var(--radius-m);padding:12px 16px;margin-bottom:20px;font-size:.9rem;flex-wrap:wrap}
/* Agenda grid */
.week{display:grid;grid-template-columns:56px repeat(5,minmax(120px,1fr));min-width:720px}
.week .hd{padding:10px 8px;border-bottom:1px solid var(--line);font-size:.84rem;font-weight:600;position:sticky;top:0;background:var(--surface);z-index:1}
.week .hd.today{color:var(--primary)}
.week .hr{font-size:.76rem;color:var(--ink-3);padding:4px 8px;border-right:1px solid var(--line);font-variant-numeric:tabular-nums}
.week .cell{border-bottom:1px dashed var(--line);border-right:1px solid var(--line);min-height:38px;padding:3px;cursor:pointer}
.week .cell.off{background:repeating-linear-gradient(135deg,var(--sunk) 0 6px,transparent 6px 12px);cursor:default}
.week .cell.free:hover{background:var(--primary-soft)}
.slot{font-size:.78rem;border-radius:5px;padding:4px 7px;background:var(--primary-soft);border-left:3px solid var(--primary);line-height:1.25}
.slot.presente{background:var(--ok-soft);border-left-color:var(--ok)}
.slot.ausente{background:var(--danger-soft);border-left-color:var(--danger);text-decoration:line-through;text-decoration-color:var(--ink-3)}
.slot small{display:block;color:var(--ink-2)}
/* HC timeline */
.ptop{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:18px}
.ptop h1{font-weight:600;font-size:1.8rem;letter-spacing:-0.02em}
.facts{display:flex;gap:18px;flex-wrap:wrap;color:var(--ink-2);font-size:.88rem;margin-top:6px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:10px 14px;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--primary);border-bottom-color:var(--brand);font-weight:600}
.tabs button:focus-visible{outline:2px solid var(--primary)}
.tl-day{margin:22px 0 8px;font-size:.84rem;color:var(--ink-3);font-weight:500}
.tl-day:first-child{margin-top:0}
.entry{display:grid;grid-template-columns:4px 1fr;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.entry .rail{border-radius:3px}
.entry .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.84rem;color:var(--ink-2)}
.entry .meta b{color:var(--ink);font-weight:600}
.entry .text{font-family:var(--serif);font-size:1.06rem;line-height:1.6;margin-top:6px;max-width:72ch;white-space:pre-wrap}
.entry .sig{font-size:.77rem;color:var(--ink-3);margin-top:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.addenda{margin-top:10px;padding:8px 12px;border-left:2px solid var(--line);font-family:var(--serif);font-size:.98rem}
.addenda small{display:block;font-family:var(--sans);color:var(--ink-3);font-size:.76rem}
.vitals{display:flex;gap:14px;font-size:.84rem;margin-top:6px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.locked{padding:40px 24px;text-align:center;border:1px dashed var(--line);border-radius:var(--radius-m);color:var(--ink-2)}
.locked b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:6px}
/* Beds */
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.bed{padding:12px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.bed:first-child{border-top:none}
.bed.free{color:var(--ink-3)}
/* Kanban */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--sunk);border-radius:var(--radius-m);padding:10px;display:flex;flex-direction:column;gap:10px;min-height:120px}
.col h3{font-size:.9rem;padding:4px 6px;display:flex;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 12px;display:flex;flex-direction:column;gap:7px;font-size:.87rem}
/* Meds */
.hourblock{margin-bottom:18px}
.hourblock.now .panel{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.medrow{display:grid;grid-template-columns:1.1fr 1.4fr auto;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line);align-items:center}
.medrow:last-child{border-bottom:none}
/* Modal */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.scrim.open{display:flex}
.modal{background:var(--surface);border-radius:14px;width:min(560px,100%);max-height:calc(100% - 40px);overflow:auto;border:1px solid var(--line)}
.modal .mh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal .mb{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.88rem;opacity:0;transition:opacity .2s, transform .2s;z-index:60;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.rule{display:grid;grid-template-columns:28px 1fr auto;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);align-items:center}
.rule:last-child{border-bottom:none}
.rule .n{font-variant-numeric:tabular-nums;color:var(--ink-3)}

/* Panel del día */
.counters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}
.counter{cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px;display:flex;flex-direction:column;gap:2px;text-align:left;font:inherit;color:inherit}
.counter:hover{border-color:var(--ink-3)}
.counter[aria-pressed="true"]{border:2px solid var(--brand);padding:13px 17px}
.counter b{font-size:1.65rem;letter-spacing:-.02em;font-weight:700}
.counter.warn b{color:var(--warn)}
.counter span{font-size:.84rem;color:var(--ink-2)}
.panelgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.lhead{display:flex;align-items:center;gap:8px;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.lhead select{width:auto;margin-left:auto}
.trow{display:grid;grid-template-columns:52px minmax(0,1.3fr) minmax(0,1.2fr) minmax(0,1.1fr) 118px 156px;gap:14px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.thead{font-size:.78rem;color:var(--ink-3);font-weight:500;padding-top:9px;padding-bottom:9px}
.tgroup{padding:8px 18px;background:var(--sunk);border-bottom:1px solid var(--line);font-size:.74rem;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em}
.tgroup span{color:var(--ink-3);margin-left:6px}
.c-hora{font-weight:600;font-variant-numeric:tabular-nums}
.c-pac b{display:block;font-weight:600}
.c-pac small,.c-cob small{color:var(--ink-3);font-size:.8rem}
.c-cob{display:flex;flex-direction:column;align-items:flex-start;gap:4px;font-size:.88rem}
.c-cob .tag{white-space:normal}
.c-pro{display:flex;align-items:center;gap:8px;font-size:.86rem;color:var(--ink-2);white-space:nowrap;overflow:hidden}
.c-act{display:flex;justify-content:flex-end;gap:6px}
.hmob{display:none}
.btn.soft{background:var(--primary-soft);border-color:var(--primary-soft);color:var(--primary);font-weight:600}
.btn.soft:hover{border-color:var(--primary)}
.btn.icon{padding:7px 9px;line-height:1}
.lfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;background:var(--sunk);font-size:.86rem;color:var(--ink-2);flex-wrap:wrap}
.proh{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.proh:last-child{border-bottom:none}
.todo{display:flex;gap:12px;padding:12px 18px;border:0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:none;font:inherit;color:inherit}
.todo:last-child{border-bottom:none}
.todo:hover{background:var(--sunk)}
.todo .ic{color:var(--warn);flex:none;margin-top:2px}
.nowcard{padding:18px;display:flex;flex-direction:column;gap:12px}
.nowcard .lab{font-size:.76rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--primary)}
.nowcard .lab.muted{color:var(--ink-3)}
.nowcard h2{font-size:1.45rem;letter-spacing:-.02em}
.twobtn{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.twobtn .btn{min-height:44px}
@media (max-width: 900px){
  .counters{grid-template-columns:1fr 1fr;gap:10px}
  .panelgrid{grid-template-columns:minmax(0,1fr)}
  .thead{display:none}
  .trow{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"pac est" "cob cob" "pro pro" "act act";gap:8px 10px}
  .c-hora{display:none}.hmob{display:inline;font-weight:600;font-variant-numeric:tabular-nums;margin-right:6px}
  .c-pac{grid-area:pac}.c-est{grid-area:est}.c-cob{grid-area:cob;flex-direction:row;flex-wrap:wrap;align-items:center}.c-pro{grid-area:pro}.c-act{grid-area:act;justify-content:stretch}
  .c-act .btn{flex:1;min-height:44px}.c-act .btn.icon{flex:none;width:44px}
  .lhead select{width:100%;margin-left:0}
  .twobtn{grid-template-columns:1fr 1fr}
}

/* Shell según diseño aprobado */
body{display:flex;flex-direction:column}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.demobar{height:40px;flex:none;background:#1F2328;color:#E5E7EB;display:flex;align-items:center;gap:12px;padding:0 16px;font-size:.82rem;overflow-x:auto;white-space:nowrap}
.demobar .dm-l{background:var(--brand);color:#1F2328;font-weight:700;border-radius:6px;padding:2px 8px;font-size:.7rem;letter-spacing:.05em;text-transform:uppercase}
.demobar .dm-t{color:#9CA3AF}
.demobar>*{flex:none}
.demobar .rolepick{background:#2D3238;padding:3px;border-radius:8px}
.demobar .rolepick button{color:#C9CDD3;padding:4px 10px;font-size:.8rem}
.demobar .rolepick button[aria-pressed="true"]{background:#FFFFFF;color:#1F2328;box-shadow:none}
.dm-r{margin-left:auto;display:flex;gap:6px}
.dm-r button{all:unset;cursor:pointer;padding:4px 10px;border-radius:6px;color:#E5E7EB;border:1px solid #3A3F46}
.dm-r button:hover{border-color:#9CA3AF}
.app{flex:1;min-height:0;height:auto;grid-template-columns:248px minmax(0,1fr)}
.side{padding:22px 14px 18px;gap:18px}
.brand{padding:0 10px}
.tenant-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;background:var(--sunk);border:1px solid var(--sunk);border-radius:8px;padding:9px 12px;text-align:left;font:inherit;font-size:13px;color:var(--ink);cursor:pointer}
.tenant-btn small{display:block;font-size:11px;color:var(--ink-3)}
.tenant-btn>span:first-child{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{padding:0;gap:18px;display:flex;flex-direction:column;flex:1;overflow:auto}
.nav .grp{display:flex;flex-direction:column;gap:2px}
.nav .glabel{font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase;padding:0 12px 6px}
.nav button{display:flex;align-items:center;justify-content:flex-start;gap:11px;padding:9px 12px;border-radius:8px;font-size:14px;font-weight:500;color:var(--ink-2)}
.nav button .count{margin-left:auto;background:#FEF6D8;color:#8A6100}

}

<script>
/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let _seed=7;const rnd=()=>{_seed|=0;_seed=_seed+0x6D2B79F5|0;let t=Math.imul(_seed^_seed>>>15,1|_seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const pick=a=>a[Math.floor(rnd()*a.length)];
const uid=p=>p+Math.random().toString(36).slice(2,8);
const T0=new Date();T0.setHours(0,0,0,0);
const day=n=>{const d=new Date(T0);d.setDate(d.getDate()+n);return d};
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const TODAY=iso(T0);
const DIAS=['dom','lun','mar','mié','jue','vie','sáb'];const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESL=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const fd=s=>{const d=new Date(s+'T00:00');return DIAS[d.getDay()]+' '+d.getDate()+' '+MESES[d.getMonth()]};
const fdl=s=>{const d=new Date(s+'T00:00');return ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'][d.getDay()]+' '+d.getDate()+' de '+MESL[d.getMonth()]};
const diff=(a,b)=>Math.round((new Date(a+'T00:00')-new Date(b+'T00:00'))/864e5);
const money=n=>'$ '+Math.round(n).toLocaleString('es-AR');
const nowHM=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const hash=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return (h>>>0).toString(16).padStart(8,'0')};

/* ---------- catálogos y roles ---------- */
const DISC={Psicología:'--d-psi',Psiquiatría:'--d-psq','Trabajo social':'--d-ts',Enfermería:'--d-enf',Nutrición:'--d-nut',Grupal:'--d-gru'};

  profesional:{label:'Psicóloga',user:'Lic. Laura Méndez',proId:'p1',views:['hoy','agenda','pacientes','grupos'],hc:'write'},
  enfermeria:{label:'Enfermería',user:'Enf. Carla Funes',proId:'p5',views:['hoy','internacion','medicacion','pacientes'],hc:'nursing'},
  administracion:{label:'Recepción',user:'Marcela Ortiz',views:['hoy','agenda','pacientes','profesionales','autorizaciones','facturacion'],hc:'none'}
};
const VIEWS={hoy:'Panel de turnos',agenda:'Agenda',pacientes:'Pacientes',profesionales:'Profesionales',grupos:'Grupos y talleres',internacion:'Internación',medicacion:'Medicación',autorizaciones:'Autorizaciones',facturacion:'Prefacturación',config:'Configuración',auditoria:'Auditoría'};
const ESTADOS=['Preadmisión','Admisión','En tratamiento','Alta','Baja'];
const SEDES=['Sede central','Hospital de día'];
const PARENTESCOS=['Madre','Padre','Pareja','Hermano/a','Hijo/a','Tutor/a','Otro'];

// Catálogo de diagnósticos: ficticio y configurable por institución, listo para CIE-10
const DIAGS=[['F32','Episodio depresivo'],['F33','Trastorno depresivo recurrente'],['F31','Trastorno afectivo bipolar'],
  ['F41.1','Trastorno de ansiedad generalizada'],['F41.0','Trastorno de pánico'],['F20','Esquizofrenia'],
  ['F60.3','Trastorno límite de la personalidad'],['F50.0','Anorexia nerviosa'],['F50.2','Bulimia nerviosa'],
  ['F10.2','Dependencia de alcohol'],['F19.2','Dependencia de múltiples sustancias'],['F43.1','Trastorno de estrés postraumático']];
const DIAS_L=['','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const DIAS_C=['','Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const AUTH_ST=['Solicitada','Autorizada','Presentada','Cobrada'];

/* ---------- datos semilla ---------- */
function seed(){
  _seed=7;
  const H=(dias,desde,hasta,sede)=>dias.map(d=>({dia:d,desde,hasta,sede:sede||SEDES[0]}));
  const pros=[
    {id:'p1',nombre:'Lic. Laura Méndez',disc:'Psicología',mat:'MP 4821',email:'lmendez@centrodemo.ar',tel:'261 4551201',activo:true,
      firma:{tipo:'Electrónica',aclaracion:'Laura Méndez'},horarios:H([1,2,3,4,5],'09:00','12:30')},
    {id:'p2',nombre:'Dr. Martín Aguirre',disc:'Psiquiatría',mat:'MP 12034',email:'maguirre@centrodemo.ar',tel:'261 4551202',activo:true,
      firma:{tipo:'Electrónica',aclaracion:'Martín Aguirre'},horarios:H([1,2,3,4,5],'14:00','16:30')},
    {id:'p3',nombre:'Lic. Sofía Ríos',disc:'Trabajo social',mat:'MP 2210',email:'srios@centrodemo.ar',tel:'261 4551203',activo:true,
      firma:{tipo:'Escaneada',aclaracion:'Sofía Ríos'},horarios:H([2,4],'10:00','11:30')},
    {id:'p4',nombre:'Lic. Diego Paz',disc:'Psicología',mat:'MP 5130',email:'dpaz@centrodemo.ar',tel:'261 4551204',activo:true,
      firma:{tipo:'Electrónica',aclaracion:'Diego Paz'},horarios:H([1,3,5],'09:00','12:30').concat(H([2,4],'15:00','18:00',SEDES[1]))},
    {id:'p5',nombre:'Enf. Carla Funes',disc:'Enfermería',mat:'MP 7788',email:'cfunes@centrodemo.ar',tel:'261 4551205',activo:true,
      firma:{tipo:'Electrónica',aclaracion:'Carla Funes'},horarios:H([1,2,3,4,5],'07:00','19:00')},
    {id:'p6',nombre:'Lic. Valeria Sosa',disc:'Nutrición',mat:'MP 3302',email:'vsosa@centrodemo.ar',tel:'261 4551206',activo:true,
      firma:{tipo:'Electrónica',aclaracion:'Valeria Sosa'},horarios:H([3],'11:00','13:00')}
  ];
  const noms=[['Martina','Giménez'],['Tomás','Olmedo'],['Lucía','Ferreyra'],['Joaquín','Barrera'],['Camila','Ledesma'],['Franco','Videla'],['Agustina','Moyano'],['Nicolás','Quiroga'],['Florencia','Arce'],['Santiago','Lucero'],['Julieta','Correa'],['Matías','Ponce'],['Rocío','Salinas'],['Gonzalo','Herrera'],['Milagros','Díaz'],['Ezequiel','Rojas'],['Paula','Vega'],['Bruno','Castro']];
  const ooss=['OSEP','OSDE','Swiss Medical','Sancor Salud','PAMI','Particular'];
  const internados=[1,3,5,8,11,14];
  const pats=noms.map((n,i)=>{

    const equipo=[[psi,'Referente'],['p2','Tratante']];if(i%3===0)equipo.push(['p3','Interconsulta']);if(intern)equipo.push(['p6','Interconsulta']);
    const desdeEq=iso(day(-100+i*3));
    const dg=DIAGS[i%DIAGS.length];
    return {id:'pa'+(i+1),nombre:n[0],apellido:n[1],dni:String(30000000+Math.floor(rnd()*14000000)),nac:(1968+Math.floor(rnd()*38))+'-0'+(1+Math.floor(rnd()*9))+'-1'+Math.floor(rnd()*9),
      ooss:i===17?'Sancor Salud':ooss[i%ooss.length],afiliado:String(100000+Math.floor(rnd()*899999)),estado,modalidad:intern?'Internación':'Ambulatorio',
      frecuencia:intern?5:(i%4===0?3:1),
      equipo:estado==='Preadmisión'?[]:equipo.map(e=>({proId:e[0],rol:e[1],desde:desdeEq,hasta:null})),
      tel:'261 '+(4000000+Math.floor(rnd()*999999)),email:n[0].toLowerCase()+'.'+n[1].toLowerCase()+'@correo.ar',
      domicilio:pick(['San Martín','Belgrano','Las Heras','Sarmiento','Rivadavia'])+' '+(100+Math.floor(rnd()*2900))+', Mendoza',
      deuda:(i%2===1),
      contactos:[{nombre:pick(['Ana','Luis','Carolina','Pedro','Silvia'])+' '+n[1],parentesco:pick(PARENTESCOS.slice(0,5)),tel:'261 '+(4000000+Math.floor(rnd()*999999)),principal:true}],
      diagnostico:estado==='Preadmisión'?null:{codigo:dg[0],texto:dg[1],desde:desdeEq,por:'Dr. Martín Aguirre'},
      historial:[{fecha:iso(day(-120+i*3)),de:'Preadmisión',a:'Admisión',por:'Marcela Ortiz'},{fecha:iso(day(-100+i*3)),de:'Admisión',a:'En tratamiento',por:'Dra. Inés Carrizo'}].slice(0,estado==='Preadmisión'?0:estado==='Admisión'?1:2)};
  });
  // camas
  const rooms=[{id:'h1',nombre:'Habitación 1',camas:['1A','1B']},{id:'h2',nombre:'Habitación 2',camas:['2A','2B']},{id:'h3',nombre:'Habitación 3',camas:['3A','3B','3C']},{id:'h4',nombre:'Habitación 4',camas:['4A','4B']}];
  const beds={};const allBeds=rooms.flatMap(r=>r.camas);
  const intData=[[34,30],[12,30],[5,15],[27,30],[9,30],[19,20]];
  internados.forEach((pi,k)=>{beds[allBeds[k*1+(k>2?1:0)]]={pid:'pa'+(pi+1),ingreso:iso(day(-intData[k][0])),autorizados:intData[k][1]}});
  // turnos
  const turnos=[];const evols=[];
  const TXT_PSI=['Concurre puntual. Refiere semana con mayor regulación emocional; identifica dos situaciones de conflicto familiar y las estrategias utilizadas. Se trabaja registro de disparadores.','Paciente angustiado al inicio de la sesión. Se aborda la adherencia al plan semanal y se refuerzan pautas de autocuidado. Acordamos tarea de registro diario.','Buena disposición. Relata avances en la rutina de sueño. Se exploran expectativas respecto del retorno laboral. Continúa con el esquema acordado.','Se revisa el cumplimiento de objetivos terapéuticos. Mantiene abstinencia según refiere. Se trabaja prevención de recaídas y red de apoyo.'];
  const TXT_PSQ=['Control psiquiátrico. Sin efectos adversos referidos. Ánimo eutímico, sueño conservado. Se mantiene esquema farmacológico vigente.','Refiere somnolencia matinal. Se ajusta horario de toma nocturna. Próximo control en 15 días.'];

  const TXT_TS=['Entrevista con referente familiar. Se evalúa red de contención y se orienta sobre trámites de certificado de discapacidad.'];
  const pmap={};pats.forEach(p=>pmap[p.id]=p);
  const agendaPros=['p1','p2','p4','p3'];
  for(let d=-21;d<=7;d++){
    const dt=day(d);const wd=dt.getDay();if(d===0||wd===0||wd===6)continue;
    agendaPros.forEach(pro=>{
      const mine=pats.filter(p=>p.equipo.some(e=>e.proId===pro)&&p.estado!=='Preadmisión'&&(p.estado!=='Alta'||d<-5));
      const hours=pro==='p2'?['14:00','14:30','15:00','15:30','16:00']:pro==='p3'?['10:00','11:00']:['09:00','09:30','10:30','11:00','11:30','12:00'];
      hours.forEach(h=>{
        if(rnd()<0.28||!mine.length)return;
        const p=pick(mine);const past=d<0||(d===0&&h<nowHM());
        let estado='programado';if(past)estado=rnd()<0.87?'presente':'ausente';
        const t={id:uid('t'),pid:p.id,pro,fecha:iso(dt),hora:h,tipo:pro==='p2'?'Control psiquiátrico':pro==='p3'?'Entrevista social':'Sesión individual',estado};
        turnos.push(t);
        if(estado==='presente'&&!(d>=-3&&rnd()<0.22)){
          const disc=pros.find(x=>x.id===pro).disc;

        }

  // agenda de hoy con flujo de sala de espera (siempre día hábil para la demo)
  const NOW=Date.now(),MIN=60000,USED=new Map();
  const PLAN={
    p1:[['09:00','at'],['09:30','at'],['10:30','au'],['11:00','atx'],['11:30','es',18],['12:00','pl'],['15:00','pls']],
    p2:[['09:00','at'],['09:30','at'],['10:00','at'],['10:30','co',4],['11:00','es',2],['14:00','pl'],['14:30','pls'],['15:00','pl'],['16:00','pl']],

// Devuelve qué prestación se presenta, si viene de una excepción y por qué.
// La regla es la fuente; la excepción es un caso puntual con motivo, y queda a la vista.
function moduloPac(p){
  const reg=modulo(S,p,true);
  if(p.moduloExc)return {valor:p.moduloExc.prest,excepcion:true,
    motivo:'Excepción cargada por '+p.moduloExc.por+' el '+fd(p.moduloExc.fecha)+': '+p.moduloExc.motivo+'. Por reglas correspondería '+reg.valor+'.'};
  return {valor:reg.valor,excepcion:false,motivo:reg.motivo};
}
function modulo(st,p,detalle){
  if(!detalle&&p.moduloExc)return p.moduloExc.prest;
  let i=0;
  for(const r of st.reglas){
    i++;
    if(r.ooss.op==='igual'&&p.ooss!==r.ooss.v)continue;
    if(r.ooss.op==='distinta'&&p.ooss===r.ooss.v)continue;
    if(r.estados.length&&!r.estados.includes(p.estado))continue;
    if(r.modalidad&&p.modalidad!==r.modalidad)continue;
    if(r.minFrec&&p.frecuencia<r.minFrec)continue;
    const v=r.res==='=estado'?p.estado:r.res;
    return detalle?{valor:v,motivo:'Según la regla '+i+' de cobertura.'}:v;
  }
  return detalle?{valor:'No definido',motivo:'Ninguna regla de cobertura coincide. Hay que resolverlo antes de cerrar el período.'}:'No definido';
}

  ${list.map(p=>`<tr class="click" data-a="openp" data-p="${p.id}" tabindex="0"><td><b>${esc(pname(p))}</b><div class="small faint">${age(p.nac)} años</div></td><td>${p.dni}</td><td>${esc(p.ooss)}</td><td>${p.modalidad}</td><td>${estTag(p.estado)}</td>
  <td><div class="row" style="gap:4px">${equipoIds(p).map(id=>`<span class="dot" title="${esc(pro(id).nombre)}" style="background:var(${DISC[pro(id).disc]})"></span>`).join('')||'<span class="small faint">Sin asignar</span>'}</div></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Ningún paciente coincide con los filtros.</td></tr>'}

function hcTab(p){
  const lvl=R().hc;
  if(lvl==='none'){return `<div class="locked"><b>Contenido clínico restringido</b>Tu rol de ${R().label} no tiene acceso a las evoluciones. Cada intento de acceso queda registrado en la auditoría.</div>`}
  const f=S.hcf||'';
  let ev=S.evols.filter(e=>e.pid===p.id&&(!f||e.disc===f)).sort((a,b)=>(b.fecha+b.hora).localeCompare(a.fecha+a.hora));
  const discs=[...new Set(S.evols.filter(e=>e.pid===p.id).map(e=>e.disc))];
  const canWrite=lvl==='write'||lvl==='nursing';
  let last='';
  const items=ev.map(e=>{const pr=pro(e.pro);let h='';if(e.fecha!==last){h+=`<div class="tl-day">${fdl(e.fecha)}</div>`;last=e.fecha}
    const mineDraft=!e.firmada&&R().proId===e.pro;
    h+=`<article class="entry"><span class="rail" style="background:var(${DISC[e.disc]})"></span><div>
      <div class="meta"><b>${esc(e.tipo)}</b><span>${e.hora} hs</span><span>${esc(pr.nombre)}</span>${e.firmada?'':'<span class="tag warn">Borrador</span>'}</div>
      ${e.vitals?`<div class="vitals"><span>TA ${e.vitals.ta}</span><span>T° ${e.vitals.t}</span><span>FC ${e.vitals.fc}</span><span>SpO₂ ${e.vitals.spo2}%</span></div>`:''}
      <div class="text">${esc(e.texto)}</div>
      ${e.addenda.map(a=>`<div class="addenda"><small>Adenda · ${fd(a.fecha)} ${a.hora} · ${esc(a.por)}</small>${esc(a.texto)}</div>`).join('')}
      <div class="sig">${e.firmada?`<span>Firmado por ${esc(pr.nombre)} · ${pr.mat} · huella ${hash(e.id+e.texto)}</span>`:''}
      ${e.firmada&&R().proId===e.pro?`<button class="btn sm ghost" data-a="addenda" data-e="${e.id}">Agregar adenda</button>`:''}
      ${mineDraft?`<button class="btn sm" data-a="editev" data-e="${e.id}">Continuar borrador</button>`:''}</div>

  return `<div class="row" style="justify-content:space-between;margin-bottom:12px">

    <div class="row">${canWrite?`<button class="btn pri" data-a="${lvl==='nursing'?'vitals':'newev'}" data-p="${p.id}">${lvl==='nursing'?'Registrar control':'Nueva evolución'}</button>`:''}<button class="btn" data-a="printhc" data-p="${p.id}">Exportar PDF</button></div></div>
    <p class="small faint" style="margin-bottom:6px">Las evoluciones firmadas no se pueden editar. Las correcciones se agregan como adenda y quedan a la vista.</p>
    <div>${items||'<div class="empty">Todavía no hay registros en la historia clínica.</div>'}</div>`;
}

/* ---------- Profesionales ---------- */
// Horarios agrupados: junta los días que comparten franja y sede ("Lun a Vie 09:00 a 12:30")
function horGrupos(pr){
  const m={};(pr.horarios||[]).forEach(h=>{const k=h.desde+'|'+h.hasta+'|'+h.sede;(m[k]=m[k]||[]).push(h.dia)});
  return Object.entries(m).map(([k,ds])=>{const [desde,hasta,sede]=k.split('|');ds.sort((a,b)=>a-b);
    const seguidos=ds.length>2&&ds.every((d,i)=>i===0||d===ds[i-1]+1);
    return {dias:seguidos?DIAS_C[ds[0]]+' a '+DIAS_C[ds[ds.length-1]]:ds.map(d=>DIAS_C[d]).join(', '),desde,hasta,sede};});
}
const horResumen=pr=>horGrupos(pr).map(g=>g.dias+' '+g.desde+' a '+g.hasta).join(' · ')||'Sin horarios cargados';
// Pacientes activos en los que el profesional forma parte del equipo tratante
const pacientesDe=id=>S.pats.filter(p=>equipoIds(p).includes(id)&&!['Alta','Baja'].includes(p.estado)).length;

  const f=S.prf||{disc:'',activo:'si'};S.prf=f;
  const list=S.pros.filter(x=>(!f.disc||x.disc===f.disc)&&(f.activo==='todos'||(f.activo==='si')===(x.activo!==false)))
    .slice().sort((a,b)=>a.nombre.localeCompare(b.nombre));
  const discs=[...new Set(S.pros.map(x=>x.disc))];
  return `<div class="head"><div><h1>Profesionales</h1><p>Quiénes atienden, con qué matrícula firman y en qué horarios</p></div>
    ${S.role==='direccion'?'<button class="btn pri" data-a="newpro">Nuevo profesional</button>':''}</div>
  <div class="panel"><div class="panel-h" style="flex-wrap:wrap">
    <div class="chips"><button class="chip" data-a="prf" data-k="disc" data-v="" aria-pressed="${!f.disc}">Todas</button>
    ${discs.map(d=>`<button class="chip" data-a="prf" data-k="disc" data-v="${d}" aria-pressed="${f.disc===d}"><span class="dot" style="background:var(${DISC[d]});margin-right:6px"></span>${d}</button>`).join('')}</div>
    <div class="chips">${[['si','Activos'],['no','Inactivos'],['todos','Todos']].map(o=>`<button class="chip" data-a="prf" data-k="activo" data-v="${o[0]}" aria-pressed="${f.activo===o[0]}">${o[1]}</button>`).join('')}</div></div>
  <div class="tablewrap"><table><thead><tr><th>Profesional</th><th>Disciplina</th><th>Matrícula</th><th>Horarios</th><th>Pacientes</th><th>Estado</th></tr></thead><tbody>
  ${list.map(x=>`<tr class="click" data-a="openpro" data-r="${x.id}" tabindex="0">
    <td><b>${esc(x.nombre)}</b><div class="small faint">${esc(x.email||'—')}</div></td>
    <td><span class="dot" style="background:var(${DISC[x.disc]})"></span> ${x.disc}</td>
    <td style="font-variant-numeric:tabular-nums">${esc(x.mat)}</td>
    <td class="small">${esc(horResumen(x))}</td>
    <td>${pacientesDe(x.id)||'—'}</td>

}

/* ---------- Grupos ---------- */
function vGrupos(){
  let gs=S.grupos;if(S.role==='profesional')gs=gs.filter(g=>g.pro===R().proId||g.inscriptos.some(canSee));
  const sel=S.sesSel&&S.sesiones.find(s=>s.id===S.sesSel);

  return `<div class="head"><div><h1>Grupos y talleres</h1><p>Cada encuentro registra la asistencia individual y genera la evolución grupal en la historia de cada paciente presente.</p></div></div>

    const ses=S.sesiones.filter(s=>s.gid===g.id).sort((a,b)=>b.fecha.localeCompare(a.fecha));
    const next=ses.filter(s=>!s.firmada).sort((a,b)=>a.fecha.localeCompare(b.fecha))[0];

  return S.evols.some(e=>e.turnoId===t.id)?'<span class="tag ok">Atendido</span>':'<span class="tag warn">Sin evolución</span>';
}
function actBtn(t){
  if(t.flujo==='porllegar')return `<button class="btn sm" data-a="llegada" data-t="${t.id}">Marcar llegada</button>`;
  if(t.flujo==='espera')return `<button class="btn sm soft" data-a="pasar" data-t="${t.id}">Hacer pasar</button>`;
  if(t.flujo==='consulta')return `<button class="btn sm" data-a="finalizar" data-t="${t.id}">Finalizar</button>`;
  return '';
}
function trow(t){

function vPanel(m){
  const all=todayT();const f=S.pnf||'todos';const fp=S.pnpro||'';
  const L=all.filter(t=>!fp||t.pro===fp);
  const G={consulta:L.filter(t=>t.flujo==='consulta'),espera:L.filter(t=>t.flujo==='espera'),porllegar:L.filter(t=>t.flujo==='porllegar'),atendidos:L.filter(t=>t.flujo==='atendido'||t.flujo==='ausente')};
  const esp=all.filter(t=>t.flujo==='espera');

  const venc=S.auths.filter(a=>a.estado==='Autorizada'&&diff(a.vence,TODAY)<=15&&diff(a.vence,TODAY)>=0);
  const sinEv=all.filter(t=>t.flujo==='atendido'&&!S.evols.some(e=>e.turnoId===t.id));

  if(f==='espera')body=grp('En sala de espera',G.espera);
  if(f==='espera15')body=grp('Esperan más de 15 minutos',G.espera.filter(t=>minsSince(t.arr)>=15));
  if(f==='porllegar')body=grp('Por llegar',G.porllegar);
  if(f==='sinconf')body=grp('Sin confirmar',G.porllegar.filter(t=>!t.conf));
  if(f==='consulta')body=grp('En consulta',G.consulta);
  if(f==='atendidos')body=grp('Atendidos y ausentes',G.atendidos);
  if(!body)body='<div class="empty">No hay turnos en este grupo.</div>';
  const chip=(k,l,n)=>`<button class="fchip" data-a="pnf" data-v="${k}" aria-pressed="${f===k}">${l} · ${n}</button>`;
  const cnt=(k,n,l,w)=>`<button class="counter ${w&&n?'warn':''}" data-a="pnf" data-v="${k}" aria-pressed="${f===k||(k==='espera'&&f==='todos')}"><b>${n}</b><span>${l}</span></button>`;
  const ids=['p2','p1','p4','p3'].filter(id=>all.some(t=>t.pro===id));
  const profs=ids.map(id=>{const ts=all.filter(t=>t.pro===id);const P=pro(id);
    const done=ts.filter(t=>['atendido','ausente','consulta'].includes(t.flujo)).length;
    let st;if(ts.some(t=>t.flujo==='consulta'))st='<span class="tag pri">En consulta</span>';else if(ts.some(t=>t.flujo==='espera'))st='<span class="tag warn">Le esperan</span>';else{const nx=ts.find(t=>t.flujo==='porllegar');st=nx?`<span class="tag">Libre hasta ${nx.hora}</span>`:'<span class="tag ok">Terminó</span>'}
    return `<div class="proh"><div class="row" style="justify-content:space-between;flex-wrap:nowrap;gap:8px"><div class="row" style="gap:9px;flex-wrap:nowrap"><span class="dot" style="background:var(${DISC[P.disc]})"></span><div><b>${esc(P.nombre)}</b><div class="small faint" style="font-size:12px">${P.disc}</div></div></div>${st}</div>
    <div class="row" style="flex-wrap:nowrap"><div class="bar" style="flex:1"><i style="width:${Math.round(done/ts.length*100)}%"></i></div><span class="faint" style="white-space:nowrap;font-size:12px">${done} de ${ts.length} turnos</span></div></div>`}).join('');
  const todos=[];
  venc.slice(0,2).forEach(a=>todos.push(`<button class="todo" data-a="go" data-v="autorizaciones"><span class="ic">${ico('autorizaciones')}</span><span><span style="display:block;font-size:14px">Pedir renovación a ${esc(a.ooss)}</span><span class="faint" style="font-size:12px">${esc(pat(a.pid).nombre+' '+pat(a.pid).apellido)} · vence el ${noDow(fd(a.vence))}</span></span></button>`));
  if(sinconf.length)todos.push(`<button class="todo" data-a="recordar"><span class="ic">${ico('bell')}</span><span><span style="display:block;font-size:14px">${sinconf.length} turno${sinconf.length>1?'s':''} sin confirmar</span><span class="faint" style="font-size:12px">Reenviar recordatorio por WhatsApp</span></span></button>`);
  if(sinEv.length)todos.push(`<button class="todo" data-a="pnf" data-v="atendidos"><span class="ic" style="color:var(--ink-2)">${ico('pen')}</span><span><span style="display:block;font-size:14px">${sinEv.length} evolución${sinEv.length>1?'es':''} sin escribir</span><span class="faint" style="font-size:12px">De turnos atendidos hoy</span></span></button>`);
  return `<div class="head" style="align-items:flex-end"><div><h1>Panel del día</h1><p>${fdl(TODAY)} · Sede central · ${all.length} turnos</p></div>
    <div class="row"><div class="row" style="gap:4px"><button class="btn icon" data-a="soon" data-m="En la demo se muestra solo el día de hoy." aria-label="Día anterior">${ico('cl',17)}</button><button class="btn">Hoy</button><button class="btn icon" data-a="soon" data-m="En la demo se muestra solo el día de hoy." aria-label="Día siguiente">${ico('cr',17)}</button></div>
    <button class="btn" data-a="soon" data-m="Bloqueá un horario de un profesional o consultorio: los turnos de esa franja quedan fuera de la agenda.">${ico('lock',17)}Bloquear horario</button><button class="btn pri" data-a="go" data-v="agenda">${ico('plus',17,2)}Nuevo turno</button></div></div>
  <div class="counters">${cnt('espera',esp.length,'en sala de espera',false)}${cnt('espera15',esp15.length,'espera más de 15 minutos',true)}${cnt('sinconf',sinconf.length,'turnos sin confirmar',true)}<button class="counter ${venc.length?'warn':''}" data-a="go" data-v="autorizaciones"><b>${venc.length}</b><span>autorizaciones por vencer</span></button></div>
  <div class="panelgrid"><section class="panel" style="overflow:hidden">
    <div class="lhead">${chip('todos','Todos',all.length)}${chip('espera','Esperando',G.espera.length)}${chip('porllegar','Por llegar',G.porllegar.length)}${chip('consulta','En consulta',G.consulta.length)}${chip('atendidos','Atendidos',G.atendidos.length)}
    <select class="fsel" data-c="pnpro" aria-label="Filtrar por profesional"><option value="">Profesionales</option>${['p1','p2','p3','p4'].map(id=>`<option value="${id}" ${fp===id?'selected':''}>${esc(pro(id).nombre)}</option>`).join('')}</select></div>
    <div class="trow thead"><span>Hora</span><span>Paciente</span><span>Cobertura</span><span>Profesional</span><span>Estado</span><span></span></div>
    ${body}
    ${f==='todos'?`<div class="lfoot"><span>Atendidos · ${G.atendidos.length}${sinEv.length?` · <span style="color:#8A6100;font-weight:500">${sinEv.length} sin evolución escrita</span>`:''}</span><button class="btn sm ghost" data-a="pnf" data-v="atendidos" style="font-weight:600">Ver atendidos</button></div>`:''}
  </section>
  <aside class="stack">
    <section class="panel" style="overflow:hidden"><div class="aside-h"><h2>Profesionales hoy</h2><span class="faint" style="font-size:12px">${ids.length} atienden</span></div>${profs}</section>
    <section class="panel" style="overflow:hidden"><div class="aside-h"><h2>Para resolver hoy</h2></div>${todos.join('')||'<div class="empty">Nada pendiente.</div>'}</section>
  </aside></div>`;
}
function vMiDia(m){
  const me=R().proId;const mine=todayT().filter(t=>t.pro===me);
  const cur=mine.find(t=>t.flujo==='consulta');
  const next=mine.find(t=>t.flujo==='espera')||mine.find(t=>t.flujo==='porllegar');
  const later=mine.filter(t=>t.flujo==='porllegar'&&t!==next);
  const done=mine.filter(t=>t.flujo==='atendido'||t.flujo==='ausente');
  const pend=m.pend;
  const pn=t=>esc(pname(pat(t.pid)));
  const curCard=cur?`<section class="panel nowcard"><div class="row" style="justify-content:space-between"><span class="lab">En consulta · ${cur.hora}</span><span class="tag pri">${minsSince(cur.ini)} min</span></div>
      <div><h2>${esc(pat(cur.pid).nombre+' '+pat(cur.pid).apellido)}</h2><p class="small muted">${esc(cur.tipo)} · ${esc(cobLabel(cur).o)}</p></div>
      <div class="twobtn"><button class="btn pri" data-a="newev" data-p="${cur.pid}" data-t="${cur.id}">Evolución</button><button class="btn" data-a="finalizar" data-t="${cur.id}">Finalizar</button><button class="btn" data-a="openp" data-p="${cur.pid}">Ver historia</button></div></section>`
    :`<section class="panel nowcard"><span class="lab muted">En consulta</span><p class="muted">No tenés a nadie en consulta ahora.</p></section>`;
  const nextCard=next?`<section class="panel nowcard"><span class="lab muted">Siguiente · ${next.hora}</span>
      <div class="row" style="justify-content:space-between"><div><h2 style="font-size:1.2rem">${esc(pat(next.pid).nombre+' '+pat(next.pid).apellido)}</h2><p class="small muted">${esc(next.tipo)} · ${esc(cobLabel(next).o)}</p></div>${estTagF(next)}</div>
      ${next.flujo==='espera'?`<button class="btn soft" style="min-height:44px" data-a="pasar" data-t="${next.id}" ${cur?'disabled title="Finalizá la consulta actual primero"':''}>Hacer pasar</button>`:''}</section>`:'';
  const li=(t,extra)=>`<div class="agenda-row"><time>${t.hora}</time><div><div>${pn(t)}</div><div class="small muted">${esc(t.tipo)}</div></div>${extra}</div>`;
  return `<div class="head"><div><h1>Mi día</h1><p>${fdl(TODAY)} · ${mine.length} turnos</p></div></div>
  ${pend.length?`<div class="banner" style="background:var(--warn-soft);color:var(--warn)"><span>${pend.length} evolución${pend.length>1?'es':''} sin escribir</span><button class="btn sm" data-a="newev" data-p="${pend[0].pid}" data-t="${pend[0].id}">Escribir la primera</button></div>`:''}
  <div class="grid2"><div class="stack">${curCard}${nextCard}</div>
  <div class="stack"><section class="panel"><div class="panel-h"><h2>Más tarde</h2></div>${later.map(t=>li(t,estTagF(t))).join('')||'<div class="empty">No quedan más turnos hoy.</div>'}</section>
  <section class="panel"><div class="panel-h"><h2>Atendidos hoy</h2></div>${done.map(t=>li(t,t.flujo==='ausente'?'<span class="tag danger">Ausente</span>':S.evols.some(e=>e.turnoId===t.id)?'<span class="tag ok">Con evolución</span>':`<button class="btn sm" data-a="newev" data-p="${t.pid}" data-t="${t.id}">Escribir evolución</button>`)).join('')||'<div class="empty">Todavía no atendiste pacientes hoy.</div>'}</section></div></div>`;
}

    `<button class="btn" data-a="close">Cancelar</button><button class="btn pri" data-a="savepat">Crear paciente</button>`),
  savepat:()=>{const dni=$('#nD').value.replace(/\D/g,'');const n=$('#nN').value.trim(),a=$('#nA').value.trim();if(!n||!a||dni.length<7){toast('Completá nombre, apellido y un DNI válido');return}
    const ex=S.pats.find(p=>p.dni===dni);if(ex){close();toast('Ese DNI ya existe: se abrió la ficha');A.openp({p:ex.id});return}
    const ooss=$('#nO').value;const af=$('#nAf').value.trim();
    if(ooss!=='Particular'&&!af){toast('Cargá el número de afiliado de la obra social');return}
    const p={id:uid('pa'),nombre:n,apellido:a,dni,nac:$('#nF').value||'1990-01-01',ooss,afiliado:ooss==='Particular'?'—':af,
      estado:'Preadmisión',modalidad:'Ambulatorio',frecuencia:1,equipo:[],tel:'',email:'',domicilio:'',
      contactos:[],diagnostico:null,historial:[]};
    S.pats.push(p);audit('Creó paciente',pname(p));close();A.openp({p:p.id,tab:'datos'});toast('Paciente creado en preadmisión')},
  ses:d=>{S.sesSel=d.s||null;render()},
  asis:d=>{const s=S.sesiones.find(x=>x.id===d.s);s.tema=$('#sTema').value;s.obs=$('#sObs').value;s.asis[d.p]=d.v==='1';render()},
  allpres:d=>{const s=S.sesiones.find(x=>x.id===d.s);s.tema=$('#sTema').value;s.obs=$('#sObs').value;Object.keys(s.asis).forEach(k=>s.asis[k]=true);render()},
  firmases:d=>{const s=S.sesiones.find(x=>x.id===d.s);const g=S.grupos.find(x=>x.id===s.gid);s.tema=$('#sTema').value.trim();s.obs=$('#sObs').value.trim();
    if(!s.tema){toast('Indicá el tema trabajado');return}if(Object.values(s.asis).some(v=>v===null)){toast('Marcá la asistencia de todos los participantes');return}
    s.firmada=true;let n=0;Object.entries(s.asis).forEach(([pid,v])=>{if(v){n++;S.evols.push({id:uid('e'),pid,pro:g.pro,fecha:s.fecha,hora:g.hora,tipo:g.nombre,disc:'Grupal',texto:'Tema: '+s.tema+'. '+s.obs,firmada:true,sesionId:s.id,addenda:[]})}});
    audit('Firmó encuentro grupal',g.nombre+' — '+n+' presentes');render();toast(n+' evoluciones grupales agregadas a las historias clínicas')},
  ingreso:d=>{const free=S.pats.filter(p=>p.estado!=='Alta'&&p.modalidad==='Ambulatorio');
    modal('Ingreso a cama '+d.c,`<label class="f">Paciente<select id="mP">${free.map(p=>`<option value="${p.id}">${esc(pname(p))}</option>`).join('')}</select></label><label class="f">Días autorizados<input type="number" id="mD" value="15"></label>`,`<button class="btn" data-a="close">Cancelar</button><button class="btn pri" data-a="saveing" data-c="${d.c}">Registrar ingreso</button>`)},
  saveing:d=>{const p=pat($('#mP').value);S.beds[d.c]={pid:p.id,ingreso:TODAY,autorizados:+$('#mD').value||15};p.modalidad='Internación';p.estado='En tratamiento';if(!equipoIds(p).includes('p6'))p.equipo.push({proId:'p6',rol:'Interconsulta',desde:TODAY,hasta:null});audit('Registró ingreso a internación',pname(p)+' — cama '+d.c);close();render();toast('Ingreso registrado')},
  prorroga:d=>{const b=S.beds[d.c];b.autorizados+=15;audit('Registró prórroga (+15 días)',pname(pat(b.pid)));render();toast('Prórroga de 15 días registrada')},
  adm:d=>{if(d.v==='0'){modal('Toma no administrada',`<label class="f">Motivo<select id="mM"><option>Rechazo del paciente</option><option>Paciente en permiso de salida</option><option>Indicación suspendida por guardia</option><option>Otro</option></select></label>`,`<button class="btn" data-a="close">Cancelar</button><button class="btn pri" data-a="saveadm" data-e="${d.e}" data-h="${d.h}" data-v="0">Registrar</button>`);return}A.saveadm(d)},
  saveadm:d=>{const e=S.esquemas.find(x=>x.id===d.e);const mot=d.v==='0'?$('#mM').value:'';S.admins.push({id:uid('a'),eid:e.id,fecha:TODAY,hora:d.h,estado:d.v==='1'?'Administrada':'No administrada',motivo:mot,por:R().user,ts:nowHM()});
    audit(d.v==='1'?'Registró administración':'Registró toma no administrada',e.med+' — '+pname(pat(e.pid)));close();render();toast('Toma registrada')},
  advauth:d=>{const a=S.auths.find(x=>x.id===d.id);const nx=AUTH_ST[AUTH_ST.indexOf(a.estado)+1];audit('Autorización '+a.estado.toLowerCase()+' → '+nx.toLowerCase(),a.ooss+' — '+pname(pat(a.pid)));a.estado=nx;render();toast('Autorización '+nx.toLowerCase())},
  cerrar:()=>{S.cerrados.push(TODAY.slice(0,7));audit('Cerró período de facturación',TODAY.slice(0,7));render();toast('Período cerrado. Ya no se puede modificar.')},
  delrule:d=>{S.reglas=S.reglas.filter(r=>r.id!==d.id);audit('Eliminó regla de cobertura',d.id);render();toast('Regla quitada. Revisá la prefacturación.')},
  newrule:()=>modal('Nueva regla de cobertura',`<div class="fgrid"><label class="f">Obra social<select id="rO"><option value="">Cualquiera</option>${S.ooss.map(o=>`<option>${o}</option>`).join('')}</select></label>
    <label class="f">Estado del paciente<select id="rE"><option value="">Cualquiera</option>${ESTADOS.map(e=>`<option>${e}</option>`).join('')}</select></label>
    <label class="f">Modalidad<select id="rM"><option value="">Cualquiera</option><option>Ambulatorio</option><option>Internación</option></select></label>
    <label class="f">Presentar como<select id="rR">${S.prest.map(p=>`<option>${p}</option>`).join('')}</select></label></div>
    <p class="small faint">La regla nueva se agrega al principio de la lista, así tiene prioridad.</p>`,`<button class="btn" data-a="close">Cancelar</button><button class="btn pri" data-a="saverule">Agregar regla</button>`),
  saverule:()=>{const o=$('#rO').value,e=$('#rE').value;S.reglas.unshift({id:uid('r'),ooss:o?{op:'igual',v:o}:{op:'cualquiera',v:''},estados:e?[e]:[],modalidad:$('#rM').value,minFrec:0,res:$('#rR').value,nota:'Agregada en la demo'});audit('Agregó regla de cobertura',$('#rR').value);close();render();toast('Regla agregada')}
};
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-a]');if(!el)return;const f=A[el.dataset.a];if(f){if(el.dataset.a==='vitals')ev.stopPropagation();f(el.dataset,el,ev)}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')close();if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('[role=button],tr.click')){ev.preventDefault();ev.target.click()}});
document.addEventListener('input',ev=>{const c=ev.target.dataset.c;if(c==='pq'){S.pf.q=ev.target.value;const pos=ev.target.selectionStart;render();const i=$('[data-c=pq]');i.focus();i.setSelectionRange(pos,pos)}});
document.addEventListener('change',ev=>{if(ev.target.dataset.c==='agpro'){S.agPro=ev.target.value;render()}if(ev.target.dataset.c==='pnpro'){S.pnpro=ev.target.value;render()}
  // Los pacientes particulares no tienen numero de afiliado
  if(ev.target.dataset.c==='nooss'){const i=$('#nAf');const part=ev.target.value==='Particular';i.disabled=part;i.placeholder=part?'No corresponde':'Como figura en la credencial';if(part)i.value=''}});
document.addEventListener('keydown',ev=>{if(ev.target.id==='gsearch'&&ev.key==='Enter'){const q=ev.target.value.trim();if(!R().views.includes('pacientes')){toast('Tu rol no tiene acceso a la lista de pacientes');return}S.pf={q,estado:'',mod:''};S.view='pacientes';ev.target.value='';render()}});
$('#scrim').addEventListener('click',ev=>{if(ev.target.id==='scrim')close()});
render();
setInterval(()=>{if(S.view==='hoy'&&['administracion','profesional'].includes(S.role)&&!$('#scrim').classList.contains('open')&&!(document.activeElement&&document.activeElement.matches('input,select,textarea')))render()},30000);
</script>
</body>
</html>
